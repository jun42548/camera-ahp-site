<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카메라 구매 정보탐색 방식 AHP 설문 · AHP 설문</title>
<style>
:root{--bg:#f5f5f2;--panel:#fff;--ink:#1c1c1c;--muted:#6e6e69;--line:#e4e4df;--line2:#cfcfc8;--blue:#2457c5;--blue-bg:#e9effb;--red:#c23b3b;--red-bg:#fbecec;--ok:#2e7d4f;--ok-bg:#e7f3ec;--warn:#9a5b00;--warn-bg:#fff5e3;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 20px;min-height:52px}
.brand{font-weight:700;letter-spacing:-.01em;font-size:16px}.brand b{color:var(--blue)}
.top-right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.demo{background:var(--warn-bg);color:var(--warn);font-size:13px;padding:8px 20px;border-bottom:1px solid #f0dfbf}
main{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
.narrow{max-width:620px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
h1{font-size:22px;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em}h2{font-size:18px;line-height:1.4;margin:0 0 6px}h3{font-size:15px;margin:0 0 12px}
p{margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13px}.pre{white-space:pre-wrap}
.eyebrow{font-size:12px;font-weight:600;color:var(--blue);letter-spacing:.02em;margin-bottom:6px}
.btn{appearance:none;border:1px solid var(--line2);background:#fff;border-radius:6px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
a.btn{color:var(--ink)}a.btn.primary{color:#fff}.btn:hover{background:#f1f1ed}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.primary:hover{background:#383838}
.btn.sm{padding:4px 9px;font-size:13px}.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:#efefea}
.btn.danger{color:var(--red)}.btn.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}.btn.wide{width:100%;justify-content:center;padding:11px}
input[type=text],input[type=password],input[type=number],textarea,select{font-size:14px;border:1px solid var(--line2);border-radius:6px;padding:8px 10px;background:#fff;width:100%;min-width:0}
::placeholder{color:#a8a8a2}
input:focus,textarea:focus,select:focus{outline:2px solid var(--blue-bg);border-color:var(--blue)}
.lbl{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}.chk input{width:16px;height:16px;margin:0}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.grow{flex:1}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:16px 0 4px}
.facts>div{background:#fff;padding:10px 12px}.facts b{display:block;font-size:18px}.facts span{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#efefea;color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--red-bg);color:var(--red)}.tag.blue{background:var(--blue-bg);color:var(--blue)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;cursor:pointer}.seg button+button{border-left:1px solid var(--line2)}.seg button.on{background:var(--ink);color:#fff}
.note{font-size:13px;border-radius:6px;padding:10px 12px;background:#f3f3ef;margin:10px 0}.note.warn{background:var(--warn-bg);color:var(--warn)}.note.bad{background:var(--red-bg);color:var(--red)}.note.ok{background:var(--ok-bg);color:var(--ok)}
.center{text-align:center;padding:60px 20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1}#toast.err{background:var(--red)}
/* evaluator */
.ev{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.nav{position:sticky;top:68px}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-item{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13.5px}
.nav-item:hover{background:#ecece7}.nav-item.on{background:#fff;box-shadow:inset 0 0 0 1px var(--line2);font-weight:600}
.nav-item .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line2)}.nav-item.done .dot{background:var(--ok);border-color:var(--ok)}.nav-item.badcr .dot{background:var(--red);border-color:var(--red)}
.nav-item .nc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:6px;background:#e6e6e0;border-radius:3px;overflow:hidden;margin:6px 0 14px}.progress>i{display:block;height:100%;background:var(--ok)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
q{quotes:"‘" "’";font-weight:700}
.pairs{margin-top:14px}
.pair,.legend-row{display:grid;grid-template-columns:minmax(80px,1fr) minmax(0,580px) minmax(80px,1fr);gap:14px;align-items:center}
.pair{padding:12px 6px;border-top:1px solid var(--line)}
.pair.todo .pname{color:var(--ink)}.pair.hint{background:var(--warn-bg);border-radius:6px}
.pname{font-weight:600;font-size:14px;line-height:1.35;word-break:keep-all}.pname small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.pname.left{text-align:right}
.wide-card{max-width:980px;margin:0 auto}
.diagram-wrap{overflow:auto;border:1px solid var(--line);background:#fff;border-radius:6px;padding:14px}
.diagram-wrap svg{display:block;margin:0 auto;max-width:100%;height:auto}
.descs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 18px;font-size:12.5px;line-height:1.45;background:#fafaf7;border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:12px 0 0}.descs b{font-weight:600;margin-right:6px}.descs span{color:var(--muted)}
.scale,.legend{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.legend{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}
.legend span{overflow:visible}
.s{border:1px solid var(--line2);background:#fff;border-radius:4px;height:34px;padding:0;font-size:13px;cursor:pointer;min-width:0;font-variant-numeric:tabular-nums}
.s.L{color:var(--blue)}.s.R{color:var(--red)}.s.C{font-weight:700}
.s:hover{border-color:var(--ink)}
.s.L.on{background:var(--blue);border-color:var(--blue);color:#fff}.s.R.on{background:var(--red);border-color:var(--red);color:#fff}.s.C.on{background:var(--ink);border-color:var(--ink);color:#fff}
.hinttxt{grid-column:2/3;font-size:12.5px;color:var(--warn);margin-top:-4px}
.meaning{grid-column:2/3;font-size:13px;color:var(--ink);margin-top:-4px;line-height:1.5}.meaning b{font-weight:600}.meaning.l b{color:var(--blue)}.meaning.r b{color:var(--red)}
.dir{display:flex;justify-content:space-between;font-size:12px;margin:0 0 4px}.dir .l{color:var(--blue)}.dir .r{color:var(--red)}
.result{margin-top:18px;border-top:2px solid var(--ink);padding-top:14px}
.navbtns{display:flex;align-items:center;gap:10px;margin-top:20px}.navbtns .grow{text-align:center;font-size:13px;color:var(--muted)}
.bars .row{display:grid;grid-template-columns:minmax(90px,200px) minmax(60px,1fr) 64px;gap:12px;align-items:center;font-size:14px;padding:4px 0}
.bars .row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bars .row .v{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:10px;background:#ecece6;border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);border-radius:5px}
.bars .row.top .nm{font-weight:700}.bars .row.top .bar>i{background:var(--ink)}
.rank{display:inline-block;width:20px;color:var(--muted);font-variant-numeric:tabular-nums}
/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;background:#fafaf7}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}.tbl td.best{font-weight:700}
.tbl input[type=number]{width:70px;padding:4px 6px}
.mini{display:inline-block;width:60px;height:6px;background:#e6e6e0;border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:6px}.mini>i{display:block;height:100%;background:var(--ok)}
/* admin */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.sticky{position:sticky;top:68px}
.trow{display:grid;grid-template-columns:62px minmax(110px,1fr) minmax(90px,1fr) auto;gap:8px;align-items:center;padding:5px 0 5px calc(var(--d)*22px)}
.trow .tl{font-size:12px;color:var(--muted);text-align:right}
.trow[style*="--d:0"] .tl{color:var(--blue);font-weight:600}
.tbtns{display:flex;gap:2px}
.arow{display:grid;grid-template-columns:minmax(110px,1fr) minmax(90px,1fr) auto;gap:8px;align-items:center;padding:5px 0}
.copy{display:flex;gap:6px}.copy input{font-size:12.5px;color:var(--muted)}
.plist .prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.plist .prow:first-child{border-top:0}
.meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.opts{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:4px 0 12px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rgrid>.card{margin-bottom:0}
.chart svg{width:100%;height:auto;display:block}
.slider{display:flex;gap:12px;align-items:center;margin:8px 0 12px}.slider input{flex:1}
.up{color:var(--ok)}.down{color:var(--red)}
.hero h1{font-size:26px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.steps>div{border-top:2px solid var(--ink);padding-top:8px;font-size:13px;color:var(--muted)}.steps b{display:block;color:var(--ink);font-size:13px}
.created{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.linkbox{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:10px}
.linkbox .lb-h{font-size:13px;font-weight:700;margin-bottom:6px}.linkbox .lb-h span{font-weight:400;color:var(--red);margin-left:6px;font-size:12px}
.linkbox .lb-f{font-size:12.5px;color:var(--muted);margin-top:6px}.linkbox .lb-f a{color:var(--blue)}
.linkbox.send{border-color:#b9c9ee;background:#f6f8fe}.linkbox.keep{background:#fcfcfa}
.fa-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}.fa-head h1{margin:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin:0 0 18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.drop{border:1.5px dashed var(--line2);border-radius:8px;padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;background:#fafaf7}
body.dragging .drop{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
.linkish{color:var(--blue);text-decoration:underline;cursor:pointer}
.reply{border:1.5px solid var(--ink)}
.reply-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;margin-top:12px}
.rbox{border:1px solid var(--line);border-radius:6px;padding:14px}.rb-h{font-weight:700;font-size:14px;margin-bottom:4px}
.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;resize:none;background:#fafaf7}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12.5px;padding:3px 9px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--muted)}
.chip.ok{background:var(--ok-bg);border-color:#bfdccb;color:var(--ok)}.chip.part{background:var(--warn-bg);border-color:#efd9b0;color:var(--warn)}
ol.steps-ol{padding-left:18px;margin:0 0 8px}ol.steps-ol li{margin-bottom:6px}
@media (max-width:860px){.grid2,.rgrid{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
@media (max-width:760px){
 main{padding:16px 16px 60px}.top{padding:8px 16px}
 .ev{grid-template-columns:minmax(0,1fr);gap:8px}.nav{position:static}
 .nav-list{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}.nav-item{white-space:nowrap}
 .pair,.legend-row{grid-template-columns:1fr 1fr;gap:6px 10px}
 .pair .scale,.legend-row .legend{grid-column:1/-1;order:3}.legend-row>div:not(.legend){display:none}
 .pname.left{text-align:left}.pname.right{text-align:right}
 .s{height:34px;font-size:12px;border-radius:3px}.scale,.legend{gap:2px}
 .hinttxt{grid-column:1/-1;order:4}
 .meaning{grid-column:1/-1;order:4}
 .trow{grid-template-columns:1fr auto;padding-left:calc(var(--d)*14px)}.trow .tl{display:none}.trow .tdesc{grid-column:1/-1;order:3}
 .arow{grid-template-columns:1fr auto}.arow .tdesc{grid-column:1/-1;order:3}
 .reply-grid{grid-template-columns:minmax(0,1fr)}.fa-head{align-items:flex-start}
 .card{padding:16px}.bars .row{grid-template-columns:minmax(80px,120px) 1fr 56px}
}
</style>
</head>
<body>
<header class="top"><div class="brand">AHP <b>설문</b></div><div class="top-right" id="topRight"></div></header>
<div id="demoBar"></div>

<script>window.AHP_FILE={"model":{"id":"sqhlpvc6usi2iu","name":"카메라 구매 정보탐색 방식 AHP 설문","desc":"100만 원 이상의 렌즈교환식 카메라(본체 또는 렌즈)를 새로 산다고 가정해 주세요. 지금은 사기 전에 정보를 모으는 단계이고, 아래 세 가지 방식을 모두 이용할 수 있습니다.\n\n· AI 상담: ChatGPT, Gemini 같은 생성형 AI에게 묻고 답을 받는 방식\n· 온라인 후기·커뮤니티: 유튜브 리뷰, 작례, 카메라 커뮤니티·블로그 글을 찾아보는 방식\n· 오프라인 매장 체험·상담: 매장에서 직접 만져 보고 직원과 상담하는 방식\n\n먼저 정보를 찾을 방식을 고를 때 어떤 기준이 더 중요한지 비교하고, 이어서 각 기준에서 어느 방식이 더 적합한지 비교합니다. 정답은 없으니 평소 생각대로 답해 주세요.\n\n[정도 고르는 법] 신뢰성과 편리성을 비교할 때를 예로 들면\n· 1 같음: 둘 다 똑같이 따진다\n· 3 약간: 둘 다 보지만, 믿을 수 있는 쪽에 조금 더 마음이 간다\n· 5 강하게: 둘 중 하나만 고르라면 믿을 수 있는 쪽을 고른다\n· 7 매우: 믿을 수만 있다면 시간이 꽤 더 걸려도 감수한다\n· 9 극히: 믿을 수 없다면 아무리 빠르고 편해도 쓰지 않는다\n숫자를 누르면 그 선택이 무슨 뜻인지 바로 아래에 문장으로 나오니, 내 생각과 맞는지 확인하며 고르면 됩니다.\n\n방식끼리 비교할 때도 같습니다. 예를 들어 '정확성' 면에서 AI 상담과 매장 상담 중 하나만 쓸 수 있다면 매장을 고르겠다는 정도면 매장 쪽 5(강하게)입니다.\n\n응답은 연구 목적으로만 쓰이며, 이메일 대신 참여 코드로 분석합니다. 약 10분 걸립니다.","root":{"id":"3jvacys","name":"카메라 구매 정보탐색 방식 선택","desc":"정도 고르는 법 · 3 약간: 둘 다 보지만 한쪽에 조금 더 마음이 간다 · 5 강하게: 하나만 고르라면 이쪽 · 7 매우: 이쪽을 위해 다른 쪽을 상당 부분 포기할 수 있다 · 9 극히: 다른 쪽은 거의 고려하지 않는다","children":[{"id":"jkfbsjw","name":"신뢰성","desc":"얻는 정보를 믿을 수 있는 정도. 예: 렌즈 호환이나 성능 정보가 틀리면 나에게 맞지 않는 카메라를 살 수 있다","children":[{"id":"8o9v0c7","name":"정확성","desc":"사양·호환성 정보가 사실과 맞는 정도. 예: 새 바디에 내 렌즈가 호환되는지, 손떨림 보정이 되는지 확인하고 싶을 때","children":[],"w":"정확한 사양·호환 정보","l":"사양 정보가 가끔 틀리는 것","s":"렌즈 호환·손떨림 보정 같은 사양을 확인할 때"},{"id":"qrhvs0j","name":"객관성","desc":"특정 브랜드·광고·협찬에 치우치지 않은 정도. 예: 광고 없이 솔직한 의견을 듣고 싶을 때","children":[],"w":"광고 없는 솔직한 의견","l":"광고나 협찬이 섞인 의견","s":"광고 없는 솔직한 의견을 듣고 싶을 때"}],"w":"믿을 수 있는 정보","l":"정보가 가끔 틀릴 수 있는 것"},{"id":"9jla3el","name":"편리성","desc":"적은 시간과 노력으로 정보를 얻을 수 있는 정도. 예: 퇴근길 10분 동안 폰으로 후보를 알아볼 수 있다","children":[{"id":"280ufd4","name":"시간 효율성","desc":"원하는 정보를 빠르게 얻는 정도. 예: 후보 기종을 2~3개로 빠르게 추려야 할 때","children":[],"w":"후보를 빨리 추리는 속도","l":"후보를 추리는 데 시간이 더 걸리는 것","s":"후보를 2~3개로 빨리 추려야 할 때"},{"id":"vz5lpty","name":"접근 용이성","desc":"언제 어디서든 쉽게 이용할 수 있는 정도. 예: 이동이나 예약 없이 바로 알아보고 싶을 때","children":[],"w":"언제든 바로 알아볼 수 있는 편함","l":"직접 <script>
(function(){
'use strict';
/* ================= 기본 ================= */
var BOOT = window.BOOT || {};
var IS_GAS = !!(window.google && google.script && google.script.run);
var PARAMS = BOOT.params || (function(){var o={};new URLSearchParams(location.search).forEach(function(v,k){o[k]=v});return o})();
var BASE_URL = BOOT.url || location.href.split('#')[0].split('?')[0];
var HOOK = {};
var view = document.getElementById('view');
var topRight = document.getElementById('topRight');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function pct(x,d){return isFinite(x)?(x*100).toFixed(d==null?1:d)+'%':'–'}
function sum(a){return a.reduce(function(s,v){return s+v},0)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function fmtDate(iso){if(!iso)return '';var d=new Date(iso);return d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
var toastT;
function toast(msg,err){var t=document.getElementById('toast');t.textContent=msg;t.className='show'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(function(){t.className=''},err?4000:2200)}
var sstore={get:function(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del:function(k){try{sessionStorage.removeItem(k)}catch(e){}}};
function loading(){view.innerHTML='<div class="center muted">불러오는 중…</div>'}
function message(title,body){view.innerHTML='<div class="narrow"><div class="card center"><h2>'+esc(title)+'</h2><p class="muted">'+esc(body||'')+'</p></div></div>'}

/* ================= 서버 연결 (구글 Apps Script 또는 데모) ================= */
function api(action,payload){
  if(IS_GAS){
    return new Promise(function(res,rej){
      google.script.run.withSuccessHandler(function(s){var r;try{r=JSON.parse(s)}catch(e){return rej(new Error('서버 응답 오류'))}r.ok?res(r.data):rej(new Error(r.error))})
        .withFailureHandler(function(e){rej(new Error((e&&e.message)||'서버에 연결하지 못했습니다.'))}).api(action,JSON.stringify(payload||{}));
    });
  }
  return new Promise(function(res,rej){setTimeout(function(){try{res(LocalAPI[action](payload||{}))}catch(e){rej(e)}},120)});
}
function publicProject(p){return {id:p.id,name:p.name,desc:p.desc,status:p.status,root:p.root,alts:p.alts,restricted:!p.allowOpen}}
function checkEvaluator(p,ev){
  if(!ev)throw new Error('이름(ID)을 입력하세요.');
  if(!p.allowOpen&&(p.roster||[]).indexOf(ev)<0)throw new Error('명단에 없는 평가자 ID입니다. 안내받은 ID를 확인하세요.');
}
var LocalAPI=(function(){
  var K='ahp_demo_db_v2',mem=null;
  function load(){if(mem)return mem;try{mem=JSON.parse(localStorage.getItem(K))}catch(e){}if(!mem||!mem.projects)mem={projects:{},responses:{},settings:{createMode:'open',createCode:''}};return mem}
  function save(){try{localStorage.setItem(K,JSON.stringify(mem))}catch(e){}}
  function proj(id){var p=load().projects[id];if(!p)throw new Error('설문을 찾을 수 없습니다. 링크를 확인하세요.');return p}
  function isOwner(k){return !!k&&k.indexOf('owner:')===0}
  function auth(id,k){var p=proj(id);if(k&&(k===p.adminToken||isOwner(k)))return p;throw new Error('관리 권한이 없습니다. 관리 링크를 확인하세요.')}
  function token(){return uid()+uid()+uid()}
  return {
    siteStatus:function(){return {hasOwner:true,createMode:load().settings.createMode}},
    checkOwner:function(){return true},
    getSettings:function(){return clone(load().settings)},
    saveSettings:function(a){load().settings={createMode:a.createMode,createCode:a.createCode||''};save();return true},
    createProject:function(a){var db=load(),st=db.settings;
      if(!isOwner(a.key)){if(st.createMode==='closed')throw new Error('지금은 새 설문을 만들 수 없습니다.');if(st.createMode==='code'&&a.code!==st.createCode)throw new Error('만들기 코드가 맞지 않습니다.')}
      var p=clone(a.project),now=new Date().toISOString();p.id=uid()+uid().slice(0,3);p.adminToken=token();p.created=now;p.updated=now;db.projects[p.id]=p;save();return {id:p.id,token:p.adminToken,updated:now}},
    getProject:function(a){return clone(publicProject(proj(a.id)))},
    getMyResponse:function(a){var p=proj(a.id);checkEvaluator(p,a.evaluator);var r=(load().responses[a.id]||{})[a.evaluator];return r?clone(r):null},
    saveResponse:function(a){var p=proj(a.id);if(p.status==='closed')throw new Error('평가가 마감되었습니다.');checkEvaluator(p,a.evaluator);var db=load();db.responses[a.id]=db.responses[a.id]||{};var now=new Date().toISOString();db.responses[a.id][a.evaluator]={evaluator:a.evaluator,judgments:a.judgments,progress:a.progress,complete:a.complete,updated:now};save();return {updated:now}},
    listProjects:function(){var db=load();return Object.keys(db.projects).map(function(id){var p=db.projects[id],rs=db.responses[id]||{},ks=Object.keys(rs);return {id:id,name:p.name,status:p.status,updated:p.updated,adminToken:p.adminToken,nResp:ks.length,nComplete:ks.filter(function(k){return rs[k].complete}).length}}).sort(function(a,b){return a.updated<b.updated?1:-1})},
    getProjectAdmin:function(a){return clone(auth(a.id,a.key))},
    saveProject:function(a){var old=auth(a.project.id,a.key),db=load(),p=clone(a.project),now=new Date().toISOString();p.adminToken=old.adminToken;p.created=old.created;p.updated=now;db.projects[p.id]=p;save();return {id:p.id,updated:now}},
    deleteProject:function(a){auth(a.id,a.key);var db=load();delete db.projects[a.id];delete db.responses[a.id];save();return true},

/* ================= AHP 계산 ================= */
var RI=[0,0,0,0.58,0.90,1.12,1.24,1.32,1.41,1.45,1.49,1.51,1.48,1.56,1.57,1.59];
function ri(n){return n<RI.length?RI[n]:1.59}
function findNode(root,id){var hit=null;(function w(n,p){if(hit)return;if(n.id===id){hit={node:n,parent:p};return}n.children.forEach(function(c){w(c,n)})})(root,null);return hit}
function pathOf(root,id){var path=[];(function w(n,acc){if(n.id===id){path=acc.concat(n);return true}return n.children.some(function(c){return w(c,acc.concat(n))})})(root,[]);return path}
/* 비교 묶음: 기준 묶음(위→아래) 먼저, 그다음 최하위 기준마다 대안 묶음(계층에 보이는 순서대로) */
function matricesOf(P){
  var crit=[],alt=[],q=[P.root];
  while(q.length){var n=q.shift();
    if(n.children.length>=2)crit.push({key:n.id,type:'crit',node:n,items:n.children});
    q.push.apply(q,n.children);}
  if(P.alts.length>=2)(function leaf(n){if(!n.children.length)alt.push({key:'A:'+n.id,type:'alt',node:n,items:P.alts});else n.children.forEach(leaf)})(P.root);
  return crit.concat(alt);
}
function pairsOf(m){var r=[];for(var i=0;i<m.items.length;i++)for(var j=i+1;j<m.items.length;j++)r.push([m.items[i],m.items[j]]);return r}
function pairsN(m){var n=m.items.length;return n*(n-1)/2}
function totalPairs(M){return sum(M.map(pairsN))}
function getJ(jm,a,b){if(!jm)return null;var v=jm[a+'|'+b];if(v!=null)return v;v=jm[b+'|'+a];return v!=null?1/v:null}
function setJ(jm,a,b,v){delete jm[b+'|'+a];if(v==null)delete jm[a+'|'+b];else jm[a+'|'+b]=v}
function answeredCount(m,jm){return pairsOf(m).filter(function(p){return getJ(jm,p[0].id,p[1].id)!=null}).length}
function eig(ids,A){
  var n=ids.length,w=A.map(function(r){return Math.pow(r.reduce(function(p,v){return p*v},1),1/n)}),s=sum(w);w=w.map(function(x){return x/s});
  for(var it=0;it<1000;it++){var nw=A.map(function(r){return r.reduce(function(t,v,j){return t+v*w[j]},0)});s=sum(nw);nw=nw.map(function(x){return x/s});
    var d=Math.max.apply(null,nw.map(function(x,i){return Math.abs(x-w[i])}));w=nw;if(d<1e-13)break;}
  var Aw=A.map(function(r){return r.reduce(function(t,v,j){return t+v*w[j]},0)});
  var lambda=sum(Aw.map(function(x,i){return x/w[i]}))/n;
  var ci=n>2?(lambda-n)/(n-1):0,cr=n>2?Math.max(0,ci/ri(n)):0;

}
function priority(m,jm){
  var ids=m.items.map(function(x){return x.id});

  if(A.some(function(r){return r.some(function(v){return v==null})}))return null;
  return eig(ids,A);

var SAATY=[9,8,7,6,5,4,3,2,1,1/2,1/3,1/4,1/5,1/6,1/7,1/8,1/9];
function nearestSaaty(r){var best=1,bd=1e9;SAATY.forEach(function(o){var d=Math.abs(Math.log(o)-Math.log(r));if(d<bd){bd=d;best=o}});return best}

/* 판단이 가장 어긋난 쌍 */
function inconsistentPairs(res){
  var out=[],ids=res.ids;
  for(var i=0;i<ids.length;i++)for(var j=i+1;j<ids.length;j++){var imp=res.arr[i]/res.arr[j];out.push({a:ids[i],b:ids[j],cur:res.A[i][j],imp:imp,dev:Math.abs(Math.log(res.A[i][j])-Math.log(imp)),sug:nearestSaaty(imp)})}

/* 여러 평가자 판단의 가중 기하평균 (AIJ) */
function aggregate(P,M,resps){
  var agg={},missing={};
  M.forEach(function(m){var jm={};pairsOf(m).forEach(function(p){var sl=0,sw=0;
    resps.forEach(function(r){var v=getJ((r.judgments||{})[m.key],p[0].id,p[1].id);if(v!=null&&r.weight>0){sl+=r.weight*Math.log(v);sw+=r.weight}});
    if(sw>0)jm[p[0].id+'|'+p[1].id]=Math.exp(sl/sw);else{jm[p[0].id+'|'+p[1].id]=1;missing[m.key]=true}});
    agg[m.key]=jm;});

function localWeights(M,jbm){var local={},res={};M.forEach(function(m){var r=priority(m,jbm[m.key]);if(r){local[m.key]=r.w;res[m.key]=r}});return {local:local,res:res}}
function combine(P,local){
  var g={},leaves=[],complete=true;
  (function walk(n,gw){g[n.id]=gw;if(!n.children.length){leaves.push(n);return}
    if(n.children.length===1){walk(n.children[0],gw);return}
    var lw=local[n.id];if(!lw){complete=false;n.children.forEach(function(c){walk(c,NaN)});return}
    n.children.forEach(function(c){walk(c,gw*lw[c.id])});})(P.root,1);
  var alts=null;
  if(P.alts.length>=2){var dist={},ideal={};P.alts.forEach(function(a){dist[a.id]=0;ideal[a.id]=0});
    leaves.forEach(function(l){var lw=local['A:'+l.id];if(!lw){complete=false;return}
      var mx=Math.max.apply(null,P.alts.map(function(a){return lw[a.id]}));
      P.alts.forEach(function(a){dist[a.id]+=g[l.id]*lw[a.id];ideal[a.id]+=g[l.id]*lw[a.id]/mx})});
    var si=sum(P.alts.map(function(a){return ideal[a.id]}))||1;P.alts.forEach(function(a){ideal[a.id]/=si});

function sensAt(P,local,nodeId,t){
  var f=findNode(P.root,nodeId),par=f.parent,base=local[par.id],o=base[nodeId],k=par.children.length,nw={};

        (ctx.todo.length?'<div class="note warn">남은 비교를 마치면 제출할 수 있습니다.</div>':'')+
        '<p class="small muted">제출한 뒤에는 답을 고칠 수 없습니다. 제출 전에 한 번 더 확인해 주세요.</p>'+
        '<button class="btn primary" data-act="wSubmit"'+(ready?'':' disabled')+'>제출하기</button></div>';
    };
    ACT.wSubmit=function(){
      if(!allPairsDone()||!bgDone())return toast('남은 문항을 먼저 마쳐 주세요.',true);
      W.status='complete';W.submitted=true;EV.stage='done';evSave();renderEv();window.scrollTo(0,0);
    };
    var st=document.createElement('style');
    st.textContent='.qblock{margin:18px 0 0}.qtitle{font-weight:600;margin-bottom:6px}.qopts label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line2);border-radius:6px;margin:6px 0;cursor:pointer;font-size:14px}'+
      '.qopts label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}.qopts input{margin:0;width:auto}'+
      '.qgrid{border-collapse:collapse;width:100%;font-size:14px}.qgrid th{font-weight:500;color:var(--muted);font-size:13px;padding:6px;text-align:center}.qgrid td{padding:8px 6px;border-top:1px solid var(--line);text-align:center}.qgrid td:first-child{text-align:left}.qgrid input{width:18px;height:18px}'+
      '.consent{background:#f6f6f2;border:1px solid var(--line);border-radius:6px;padding:12px 14px;max-height:260px;overflow:auto;margin-top:10px;line-height:1.6}';
    document.head.appendChild(st);
  }
  var lastName='';try{lastName=localStorage.getItem('ahpf_last_'+F.surveyId)||''}catch(e){}
  evStart(F.surveyId,F.evaluator||lastName);
}
})();
</script>
