<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHP 관리자 · 카메라 구매 설문</title>
<style>
:root{--bg:#f5f5f2;--panel:#fff;--ink:#1c1c1c;--muted:#6e6e69;--line:#e4e4df;--line2:#cfcfc8;--blue:#2457c5;--blue-bg:#e9effb;--red:#c23b3b;--red-bg:#fbecec;--ok:#2e7d4f;--ok-bg:#e7f3ec;--warn:#9a5b00;--warn-bg:#fff5e3;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 20px;min-height:52px}
.brand{font-weight:700;letter-spacing:-.01em;font-size:16px}.brand b{color:var(--blue)}
.top-right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.demo{background:var(--warn-bg);color:var(--warn);font-size:13px;padding:8px 20px;border-bottom:1px solid #f0dfbf}
main{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
.narrow{max-width:620px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
h1{font-size:22px;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em}h2{font-size:18px;line-height:1.4;margin:0 0 6px}h3{font-size:15px;margin:0 0 12px}
p{margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13px}.pre{white-space:pre-wrap}
.eyebrow{font-size:12px;font-weight:600;color:var(--blue);letter-spacing:.02em;margin-bottom:6px}
.btn{appearance:none;border:1px solid var(--line2);background:#fff;border-radius:6px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
a.btn{color:var(--ink)}a.btn.primary{color:#fff}.btn:hover{background:#f1f1ed}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.primary:hover{background:#383838}
.btn.sm{padding:4px 9px;font-size:13px}.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:#efefea}
.btn.danger{color:var(--red)}.btn.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}.btn.wide{width:100%;justify-content:center;padding:11px}
input[type=text],input[type=password],input[type=number],textarea,select{font-size:14px;border:1px solid var(--line2);border-radius:6px;padding:8px 10px;background:#fff;width:100%;min-width:0}
::placeholder{color:#a8a8a2}
input:focus,textarea:focus,select:focus{outline:2px solid var(--blue-bg);border-color:var(--blue)}
.lbl{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}.chk input{width:16px;height:16px;margin:0}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.grow{flex:1}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:16px 0 4px}
.facts>div{background:#fff;padding:10px 12px}.facts b{display:block;font-size:18px}.facts span{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#efefea;color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--red-bg);color:var(--red)}.tag.blue{background:var(--blue-bg);color:var(--blue)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;cursor:pointer}.seg button+button{border-left:1px solid var(--line2)}.seg button.on{background:var(--ink);color:#fff}
.note{font-size:13px;border-radius:6px;padding:10px 12px;background:#f3f3ef;margin:10px 0}.note.warn{background:var(--warn-bg);color:var(--warn)}.note.bad{background:var(--red-bg);color:var(--red)}.note.ok{background:var(--ok-bg);color:var(--ok)}
.center{text-align:center;padding:60px 20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1}#toast.err{background:var(--red)}
/* evaluator */
.ev{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.nav{position:sticky;top:68px}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-item{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13.5px}
.nav-item:hover{background:#ecece7}.nav-item.on{background:#fff;box-shadow:inset 0 0 0 1px var(--line2);font-weight:600}
.nav-item .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line2)}.nav-item.done .dot{background:var(--ok);border-color:var(--ok)}.nav-item.badcr .dot{background:var(--red);border-color:var(--red)}
.nav-item .nc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:6px;background:#e6e6e0;border-radius:3px;overflow:hidden;margin:6px 0 14px}.progress>i{display:block;height:100%;background:var(--ok)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
q{quotes:"‘" "’";font-weight:700}
.pairs{margin-top:14px}
.pair,.legend-row{display:grid;grid-template-columns:minmax(80px,1fr) minmax(0,580px) minmax(80px,1fr);gap:14px;align-items:center}
.pair{padding:12px 6px;border-top:1px solid var(--line)}
.pair.todo .pname{color:var(--ink)}.pair.hint{background:var(--warn-bg);border-radius:6px}
.pname{font-weight:600;font-size:14px;line-height:1.35;word-break:keep-all}.pname small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.pname.left{text-align:right}
.wide-card{max-width:980px;margin:0 auto}
.diagram-wrap{overflow:auto;border:1px solid var(--line);background:#fff;border-radius:6px;padding:14px}
.diagram-wrap svg{display:block;margin:0 auto;max-width:100%;height:auto}
.descs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 18px;font-size:12.5px;line-height:1.45;background:#fafaf7;border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:12px 0 0}.descs b{font-weight:600;margin-right:6px}.descs span{color:var(--muted)}
.scale,.legend{display:grid;grid-template-columns:repeat(17,minmax(0,1fr));gap:3px}
.legend{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}
.legend span{overflow:visible}
.s{border:1px solid var(--line2);background:#fff;border-radius:4px;height:34px;padding:0;font-size:13px;cursor:pointer;min-width:0;font-variant-numeric:tabular-nums}
.s.L{color:var(--blue)}.s.R{color:var(--red)}.s.C{font-weight:700}
.s:hover{border-color:var(--ink)}
.s.L.on{background:var(--blue);border-color:var(--blue);color:#fff}.s.R.on{background:var(--red);border-color:var(--red);color:#fff}.s.C.on{background:var(--ink);border-color:var(--ink);color:#fff}
.hinttxt{grid-column:2/3;font-size:12.5px;color:var(--warn);margin-top:-4px}
.dir{display:flex;justify-content:space-between;font-size:12px;margin:0 0 4px}.dir .l{color:var(--blue)}.dir .r{color:var(--red)}
.result{margin-top:18px;border-top:2px solid var(--ink);padding-top:14px}
.navbtns{display:flex;align-items:center;gap:10px;margin-top:20px}.navbtns .grow{text-align:center;font-size:13px;color:var(--muted)}
.bars .row{display:grid;grid-template-columns:minmax(90px,200px) minmax(60px,1fr) 64px;gap:12px;align-items:center;font-size:14px;padding:4px 0}
.bars .row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bars .row .v{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:10px;background:#ecece6;border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);border-radius:5px}
.bars .row.top .nm{font-weight:700}.bars .row.top .bar>i{background:var(--ink)}
.rank{display:inline-block;width:20px;color:var(--muted);font-variant-numeric:tabular-nums}
/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;background:#fafaf7}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}.tbl td.best{font-weight:700}
.tbl input[type=number]{width:70px;padding:4px 6px}
.mini{display:inline-block;width:60px;height:6px;background:#e6e6e0;border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:6px}.mini>i{display:block;height:100%;background:var(--ok)}
/* admin */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.sticky{position:sticky;top:68px}
.trow{display:grid;grid-template-columns:62px minmax(110px,1fr) minmax(90px,1fr) auto;gap:8px;align-items:center;padding:5px 0 5px calc(var(--d)*22px)}
.trow .tl{font-size:12px;color:var(--muted);text-align:right}
.trow[style*="--d:0"] .tl{color:var(--blue);font-weight:600}
.tbtns{display:flex;gap:2px}
.arow{display:grid;grid-template-columns:minmax(110px,1fr) minmax(90px,1fr) auto;gap:8px;align-items:center;padding:5px 0}
.copy{display:flex;gap:6px}.copy input{font-size:12.5px;color:var(--muted)}
.plist .prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.plist .prow:first-child{border-top:0}
.meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.opts{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:4px 0 12px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rgrid>.card{margin-bottom:0}
.chart svg{width:100%;height:auto;display:block}
.slider{display:flex;gap:12px;align-items:center;margin:8px 0 12px}.slider input{flex:1}
.up{color:var(--ok)}.down{color:var(--red)}
.hero h1{font-size:26px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.steps>div{border-top:2px solid var(--ink);padding-top:8px;font-size:13px;color:var(--muted)}.steps b{display:block;color:var(--ink);font-size:13px}
.created{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.linkbox{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:10px}
.linkbox .lb-h{font-size:13px;font-weight:700;margin-bottom:6px}.linkbox .lb-h span{font-weight:400;color:var(--red);margin-left:6px;font-size:12px}
.linkbox .lb-f{font-size:12.5px;color:var(--muted);margin-top:6px}.linkbox .lb-f a{color:var(--blue)}
.linkbox.send{border-color:#b9c9ee;background:#f6f8fe}.linkbox.keep{background:#fcfcfa}
.fa-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}.fa-head h1{margin:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin:0 0 18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.drop{border:1.5px dashed var(--line2);border-radius:8px;padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;background:#fafaf7}
body.dragging .drop{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
.linkish{color:var(--blue);text-decoration:underline;cursor:pointer}
.reply{border:1.5px solid var(--ink)}
.reply-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;margin-top:12px}
.rbox{border:1px solid var(--line);border-radius:6px;padding:14px}.rb-h{font-weight:700;font-size:14px;margin-bottom:4px}
.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;resize:none;background:#fafaf7}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12.5px;padding:3px 9px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--muted)}
.chip.ok{background:var(--ok-bg);border-color:#bfdccb;color:var(--ok)}.chip.part{background:var(--warn-bg);border-color:#efd9b0;color:var(--warn)}
ol.steps-ol{padding-left:18px;margin:0 0 8px}ol.steps-ol li{margin-bottom:6px}
@media (max-width:860px){.grid2,.rgrid{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
@media (max-width:760px){
 main{padding:16px 16px 60px}.top{padding:8px 16px}
 .ev{grid-template-columns:minmax(0,1fr);gap:8px}.nav{position:static}
 .nav-list{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}.nav-item{white-space:nowrap}
 .pair,.legend-row{grid-template-columns:1fr 1fr;gap:6px 10px}
 .pair .scale,.legend-row .legend{grid-column:1/-1;order:3}.legend-row>div:not(.legend){display:none}
 .pname.left{text-align:left}.pname.right{text-align:right}
 .s{height:34px;font-size:12px;border-radius:3px}.scale,.legend{gap:2px}.legend .opt{visibility:hidden}
 .hinttxt{grid-column:1/-1;order:4}
 .trow{grid-template-columns:1fr auto;padding-left:calc(var(--d)*14px)}.trow .tl{display:none}.trow .tdesc{grid-column:1/-1;order:3}
 .arow{grid-template-columns:1fr auto}.arow .tdesc{grid-column:1/-1;order:3}
 .reply-grid{grid-template-columns:minmax(0,1fr)}.fa-head{align-items:flex-start}
 .card{padding:16px}.bars .row{grid-template-columns:minmax(80px,120px) 1fr 56px}
}
.pv-back{position:fixed;inset:0;z-index:100;background:rgba(20,20,20,.5);display:flex;flex-direction:column;padding:16px}
.pv-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border-radius:8px 8px 0 0;padding:10px 14px;border-bottom:1px solid var(--line)}
.pv-bar .btn.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.pv-wrap{flex:1;min-height:0;background:#e6e6e0;border-radius:0 0 8px 8px;display:flex;justify-content:center;overflow:auto}
.pv-wrap iframe{border:0;background:#fff;width:100%;height:100%;max-width:100%;transition:max-width .2s}
</style>
</head>
<body>
<header class="top"><div class="brand">AHP <b>관리자</b></div><div class="top-right" id="topRight"></div></header>
<div id="demoBar"></div>
<main id="view"><div class="center muted">불러오는 중…</div></main>

<script>
(function(){
'use strict';
/* ================= 기본 ================= */
var BOOT = window.BOOT || {};
var IS_GAS = !!(window.google && google.script && google.script.run);
var PARAMS = BOOT.params || (function(){var o={};new URLSearchParams(location.search).forEach(function(v,k){o[k]=v});return o})();
var BASE_URL = BOOT.url || location.href.split('#')[0].split('?')[0];
var HOOK = {};
var view = document.getElementById('view');
var topRight = document.getElementById('topRight');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function pct(x,d){return isFinite(x)?(x*100).toFixed(d==null?1:d)+'%':'–'}
function sum(a){return a.reduce(function(s,v){return s+v},0)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function fmtDate(iso){if(!iso)return '';var d=new Date(iso);return d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
var toastT;
function toast(msg,err){var t=document.getElementById('toast');t.textContent=msg;t.className='show'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(function(){t.className=''},err?4000:2200)}
var sstore={get:function(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del:function(k){try{sessionStorage.removeItem(k)}catch(e){}}};
function loading(){view.innerHTML='<div class="center muted">불러오는 중…</div>'}
function message(title,body){view.innerHTML='<div class="narrow"><div class="card center"><h2>'+esc(title)+'</h2><p class="muted">'+esc(body||'')+'</p></div></div>'}

/* ================= 서버 연결 (구글 Apps Script 또는 데모) ================= */
function api(action,payload){
  if(IS_GAS){
    return new Promise(function(res,rej){
      google.script.run.withSuccessHandler(function(s){var r;try{r=JSON.parse(s)}catch(e){return rej(new Error('서버 응답 오류'))}r.ok?res(r.data):rej(new Error(r.error))})
        .withFailureHandler(function(e){rej(new Error((e&&e.message)||'서버에 연결하지 못했습니다.'))}).api(action,JSON.stringify(payload||{}));
    });
  }
  return new Promise(function(res,rej){setTimeout(function(){try{res(LocalAPI[action](payload||{}))}catch(e){rej(e)}},120)});
}
function publicProject(p){return {id:p.id,name:p.name,desc:p.desc,status:p.status,root:p.root,alts:p.alts,restricted:!p.allowOpen}}
function checkEvaluator(p,ev){
  if(!ev)throw new Error('이름(ID)을 입력하세요.');
  if(!p.allowOpen&&(p.roster||[]).indexOf(ev)<0)throw new Error('명단에 없는 평가자 ID입니다. 안내받은 ID를 확인하세요.');
}
var LocalAPI=(function(){
  var K='ahp_demo_db_v2',mem=null;
  function load(){if(mem)return mem;try{mem=JSON.parse(localStorage.getItem(K))}catch(e){}if(!mem||!mem.projects)mem={projects:{},responses:{},settings:{createMode:'open',createCode:''}};return mem}
  function save(){try{localStorage.setItem(K,JSON.stringify(mem))}catch(e){}}
  function proj(id){var p=load().projects[id];if(!p)throw new Error('설문을 찾을 수 없습니다. 링크를 확인하세요.');return p}
  function isOwner(k){return !!k&&k.indexOf('owner:')===0}
  function auth(id,k){var p=proj(id);if(k&&(k===p.adminToken||isOwner(k)))return p;throw new Error('관리 권한이 없습니다. 관리 링크를 확인하세요.')}
  function token(){return uid()+uid()+uid()}
  return {
    siteStatus:function(){return {hasOwner:true,createMode:load().settings.createMode}},
    checkOwner:function(){return true},
    getSettings:function(){return clone(load().settings)},
    saveSettings:function(a){load().settings={createMode:a.createMode,createCode:a.createCode||''};save();return true},
    createProject:function(a){var db=load(),st=db.settings;
      if(!isOwner(a.key)){if(st.createMode==='closed')throw new Error('지금은 새 설문을 만들 수 없습니다.');if(st.createMode==='code'&&a.code!==st.createCode)throw new Error('만들기 코드가 맞지 않습니다.')}
      var p=clone(a.project),now=new Date().toISOString();p.id=uid()+uid().slice(0,3);p.adminToken=token();p.created=now;p.updated=now;db.projects[p.id]=p;save();return {id:p.id,token:p.adminToken,updated:now}},
    getProject:function(a){return clone(publicProject(proj(a.id)))},
    getMyResponse:function(a){var p=proj(a.id);checkEvaluator(p,a.evaluator);var r=(load().responses[a.id]||{})[a.evaluator];return r?clone(r):null},

/* ================= AHP 계산 ================= */
var RI=[0,0,0,0.58,0.90,1.12,1.24,1.32,1.41,1.45,1.49,1.51,1.48,1.56,1.57,1.59];
function ri(n){return n<RI.length?RI[n]:1.59}
function findNode(root,id){var hit=null;(function w(n,p){if(hit)return;if(n.id===id){hit={node:n,parent:p};return}n.children.forEach(function(c){w(c,n)})})(root,null);return hit}
function pathOf(root,id){var path=[];(function w(n,acc){if(n.id===id){path=acc.concat(n);return true}return n.children.some(function(c){return w(c,acc.concat(n))})})(root,[]);return path}
/* 비교 묶음: 기준 묶음(위→아래) 먼저, 그다음 최하위 기준마다 대안 묶음(계층에 보이는 순서대로) */
function matricesOf(P){
  var crit=[],alt=[],q=[P.root];
  while(q.length){var n=q.shift();
    if(n.children.length>=2)crit.push({key:n.id,type:'crit',node:n,items:n.children});
    q.push.apply(q,n.children);}
  if(P.alts.length>=2)(function leaf(n){if(!n.children.length)alt.push({key:'A:'+n.id,type:'alt',node:n,items:P.alts});else n.children.forEach(leaf)})(P.root);
  return crit.concat(alt);
}
function pairsOf(m){var r=[];for(var i=0;i<m.items.length;i++)for(var j=i+1;j<m.items.length;j++)r.push([m.items[i],m.items[j]]);return r}
function pairsN(m){var n=m.items.length;return n*(n-1)/2}
function totalPairs(M){return sum(M.map(pairsN))}
function getJ(jm,a,b){if(!jm)return null;var v=jm[a+'|'+b];if(v!=null)return v;v=jm[b+'|'+a];return v!=null?1/v:null}
function setJ(jm,a,b,v){delete jm[b+'|'+a];if(v==null)delete jm[a+'|'+b];else jm[a+'|'+b]=v}
function answeredCount(m,jm){return pairsOf(m).filter(function(p){return getJ(jm,p[0].id,p[1].id)!=null}).length}
function eig(ids,A){
  var n=ids.length,w=A.map(function(r){return Math.pow(r.reduce(function(p,v){return p*v},1),1/n)}),s=sum(w);w=w.map(function(x){return x/s});
  for(var it=0;it<1000;it++){var nw=A.map(function(r){return r.reduce(function(t,v,j){return t+v*w[j]},0)});s=sum(nw);nw=nw.map(function(x){return x/s});
    var d=Math.max.apply(null,nw.map(function(x,i){return Math.abs(x-w[i])}));w=nw;if(d<1e-13)break;}
  var Aw=A.map(function(r){return r.reduce(function(t,v,j){return t+v*w[j]},0)});
  var lambda=sum(Aw.map(function(x,i){return x/w[i]}))/n;
  var ci=n>2?(lambda-n)/(n-1):0,cr=n>2?Math.max(0,ci/ri(n)):0;
  var o={};ids.forEach(function(id,i){o[id]=w[i]});
  return {w:o,arr:w,lambda:lambda,ci:ci,cr:cr,A:A,ids:ids};
}
function priority(m,jm){
  var ids=m.items.map(function(x){return x.id});
  var A=ids.map(function(a,i){return ids.map(function(b,j){return i===j?1:getJ(jm,a,b)})});
  if(A.some(function(r){return r.some(function(v){return v==null})}))return null;
  return eig(ids,A);
}
var SAATY=[9,8,7,6,5,4,3,2,1,1/2,1/3,1/4,1/5,1/6,1/7,1/8,1/9];
function nearestSaaty(r){var best=1,bd=1e9;SAATY.forEach(function(o){var d=Math.abs(Math.log(o)-Math.log(r));if(d<bd){bd=d;best=o}});return best}
function ratioText(v){if(v==null)return '–';if(Math.abs(v-Math.round(v))<1e-9)return String(Math.round(v));var inv=1/v;if(Math.abs(inv-Math.round(inv))<1e-9)return '1/'+Math.round(inv);return v.toFixed(2)}
/* 판단이 가장 어긋난 쌍 */
function inconsistentPairs(res){
  var out=[],ids=res.ids;
  for(var i=0;i<ids.length;i++)for(var j=i+1;j<ids.length;j++){var imp=res.arr[i]/res.arr[j];out.push({a:ids[i],b:ids[j],cur:res.A[i][j],imp:imp,dev:Math.abs(Math.log(res.A[i][j])-Math.log(imp)),sug:nearestSaaty(imp)})}
  return out.sort(function(x,y){return y.dev-x.dev});
}
/* 여러 평가자 판단의 가중 기하평균 (AIJ) */
function aggregate(P,M,resps){
  var agg={},missing={};
  M.forEach(function(m){var jm={};pairsOf(m).forEach(function(p){var sl=0,sw=0;
    resps.forEach(function(r){var v=getJ((r.judgments||{})[m.key],p[0].id,p[1].id);if(v!=null&&r.weight>0){sl+=r.weight*Math.log(v);sw+=r.weight}});
    if(sw>0)jm[p[0].id+'|'+p[1].id]=Math.exp(sl/sw);else{jm[p[0].id+'|'+p[1].id]=1;missing[m.key]=true}});
    agg[m.key]=jm;});
  return {agg:agg,missing:missing};
}
function localWeights(M,jbm){var local={},res={};M.forEach(function(m){var r=priority(m,jbm[m.key]);if(r){local[m.key]=r.w;res[m.key]=r}});return {local:local,res:res}}
function combine(P,local){
  var g={},leaves=[],complete=true;
  (function walk(n,gw){g[n.id]=gw;if(!n.children.length){leaves.push(n);return}
    if(n.children.length===1){walk(n.children[0],gw);return}
    var lw=local[n.id];if(!lw){complete=false;n.children.forEach(function(c){walk(c,NaN)});return}
    n.children.forEach(function(c){walk(c,gw*lw[c.id])});})(P.root,1);
  var alts=null;
  if(P.alts.length>=2){var dist={},ideal={};P.alts.forEach(function(a){dist[a.id]=0;ideal[a.id]=0});
    leaves.forEach(function(l){var lw=local['A:'+l.id];if(!lw){complete=false;return}
      var mx=Math.max.apply(null,P.alts.map(function(a){return lw[a.id]}));
      P.alts.forEach(function(a){dist[a.id]+=g[l.id]*lw[a.id];ideal[a.id]+=g[l.id]*lw[a.id]/mx})});
    var si=sum(P.alts.map(function(a){return ideal[a.id]}))||1;P.alts.forEach(function(a){ideal[a.id]/=si});
    alts={distributive:dist,ideal:ideal};}
  return {global:g,leaves:leaves,alts:alts,complete:complete};
}
function sensAt(P,local,nodeId,t){
  var f=findNode(P.root,nodeId),par=f.parent,base=local[par.id],o=base[nodeId],k=par.children.length,nw={};
  par.children.forEach(function(c){nw[c.id]=c.id===nodeId?t:(o<1-1e-9?base[c.id]*(1-t)/(1-o):(1-t)/(k-1))});
  var L={};for(var key in local)L[key]=local[key];L[par.id]=nw;return combine(P,L);
}
function nodeLabel(P,m){if(m.type==='alt')return m.node.name+' · 대안';return m.node===P.root?'기준 비교':m.node.name+' · 하위'}

function evSchedule(){setSaveState('저장 대기…');clearTimeout(EV.timer);EV.timer=setTimeout(evSave,900)}
function evSave(){
  clearTimeout(EV.timer);EV.timer=null;
  if(EV.saving){EV.pending=true;return}
  EV.saving=true;setSaveState('저장 중…');
  var tot=totalPairs(EV.M),ans=evAnswered();
  api('saveResponse',{id:EV.P.id,evaluator:EV.who,judgments:EV.J,progress:tot?ans/tot:0,complete:ans===tot}).then(function(r){
    EV.retry=0;var d=new Date(r.updated);setSaveState((HOOK.savedWord||'저장됨')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'));
  }).catch(function(err){
    EV.retry=(EV.retry||0)+1;
    if(EV.retry<=3&&!/마감|명단/.test(err.message)){setSaveState('다시 저장하는 중…');EV.timer=setTimeout(evSave,2500*EV.retry)}
    else{setSaveState('<button class="btn sm danger" data-act="evRetry">저장 실패 · 다시 시도</button>');toast(err.message,true)}
  })
  .then(function(){EV.saving=false;if(EV.pending){EV.pending=false;evSave()}});
}
window.addEventListener('beforeunload',function(e){if(EV.timer||EV.saving){e.preventDefault();e.returnValue=''}});
function renderEvSummary(){
  var P=EV.P,M=EV.M,lw=localWeights(M,EV.J),syn=combine(P,lw.local),tot=totalPairs(M),ans=evAnswered();
  var todo=M.map(function(m,i){return {m:m,i:i,left:pairsN(m)-answeredCount(m,EV.J[m.key])}}).filter(function(x){return x.left>0});
  var bad=M.map(function(m,i){return {m:m,i:i,r:lw.res[m.key]}}).filter(function(x){return x.r&&x.m.items.length>2&&x.r.cr>0.1});
  var h='<div class="narrow" style="max-width:760px"><div class="card"><div class="eyebrow">'+esc(P.name)+'</div><h1>'+(todo.length?'아직 남은 비교가 있습니다':'평가를 모두 마쳤습니다')+'</h1>';
  if(todo.length)h+='<p class="muted">'+ans+' / '+tot+' 완료. 아래 묶음을 마저 해 주세요.</p><div class="toolbar">'+todo.map(function(x){return '<button class="btn sm" data-act="evGo" data-i="'+x.i+'">'+esc(nodeLabel(P,x.m))+' ('+x.left+'개 남음)</button>'}).join('')+'</div>';
  else h+='<p class="muted">'+(HOOK.doneText||'답은 자동으로 저장되었습니다. 창을 닫아도 됩니다. 고치고 싶으면 언제든 같은 이름으로 다시 들어오세요.')+'</p>';
  if(bad.length)h+='<div class="note warn">일관성 비율(CR)이 0.1을 넘는 묶음이 '+bad.length+'개 있습니다: '+bad.map(function(x){return '<a href="#" data-act="evGo" data-i="'+x.i+'">'+esc(nodeLabel(P,x.m))+'</a>'}).join(', ')+'</div>';
  h+='</div>';
  if(HOOK.summaryExtra)h+=HOOK.summaryExtra({syn:syn,todo:todo,bad:bad});
  if(syn.complete){
    if(syn.alts)h+='<div class="card"><h3>내 판단으로 본 대안 순위</h3>'+barsHtml(P.alts.map(function(a){return {name:a.name,v:syn.alts.distributive[a.id]}}),true)+'</div>';
    h+='<div class="card"><h3>내 판단으로 본 기준 중요도</h3>'+barsHtml(syn.leaves.filter(function(l){return l!==P.root}).map(function(l){return {name:l.name,v:syn.global[l.id]}}),true)+'</div>';
  }
  h+='<div class="card"><h3>묶음별 일관성</h3><div class="tbl-wrap"><table class="tbl"><tr><th>묶음</th><th class="num">항목 수</th><th>CR</th><th></th></tr>'+
    M.map(function(m,i){return '<tr><td>'+esc(nodeLabel(P,m))+'</td><td class="num">'+m.items.length+'</td><td>'+crTag(m,lw.res[m.key])+'</td><td><button class="btn sm ghost" data-act="evGo" data-i="'+i+'">보기·고치기</button></td></tr>'}).join('')+'</table></div></div></div>';
  view.innerHTML=h;
}

/* ================= 계층 구조도 (학술 흑백 스타일 SVG) ================= */
var DG_FONT="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif";
var dgCtx=null;
function dgMeasure(s,size,weight){
  s=String(s||'');
  try{if(!dgCtx)dgCtx=document.createElement('canvas').getContext('2d');dgCtx.font=(weight||400)+' '+size+'px '+DG_FONT;var w=dgCtx.measureText(s).width;if(w>0||!s)return w}catch(e){}
  var t=0;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);t+=c>=0x1100?size:c===32?size*0.3:size*0.6}return t;
}
function dgFit(s,max,size,weight){s=String(s||'');if(dgMeasure(s,size,weight)<=max)return s;var t=s;while(t.length>1&&dgMeasure(t+'…',size,weight)>max)t=t.slice(0,-1);return t+'…'}
function dgRole(d){return d===0?'목표':d===1?'기준':d===2?'하위기준':'세부기준'}
/* opt.sub(node) / opt.altSub(alt): 회색 둘째 줄 (없으면 제목만), opt.emph: {id:true} 굵은 테두리 */
function hierarchySvg(P,opt){
  opt=opt||{};
  var TS=13,SS=11,PADX=14,GAP=16,VGAP=44,GUT=88,LBLX=12,TOP=16,BOTTOM=16,RIGHT=16;
  var hasSub=!!(opt.sub||opt.altSub),H=hasSub?48:34,alts=P.alts||[],nA=alts.length;
  var maxD=0,nonRoot=[];
  (function walk(n,d){maxD=Math.max(maxD,d);if(d>0)nonRoot.push(n.name);n.children.forEach(function(c){walk(c,d+1)})})(P.root,0);
  var subTexts=[];
  if(opt.sub)(function w(n){var s=opt.sub(n);if(s)subTexts.push(s);n.children.forEach(w)})(P.root);
  if(opt.altSub)alts.forEach(function(a){var s=opt.altSub(a);if(s)subTexts.push(s)});
  var widest=Math.max.apply(null,[60].concat(nonRoot.concat(alts.map(function(a){return a.name})).map(function(s){return dgMeasure(s||'이름 없음',TS,600)})).concat(subTexts.map(function(s){return dgMeasure(s,SS,400)})));
  var BW=Math.round(Math.max(88,Math.min(156,widest+PADX*2)));
  var RW=Math.round(Math.max(BW,Math.min(240,dgMeasure(P.root.name||'목표',TS,600)+PADX*2+8)));
  var slot=0,X={};
  (function place(n){if(!n.children.length){X[n.id]=slot*(BW+GAP)+BW/2;slot++}else{n.children.forEach(place);X[n.id]=(X[n.children[0].id]+X[n.children[n.children.length-1].id])/2}})(P.root);
  if(!P.root.children.length){X[P.root.id]=Math.max(RW,BW)/2;slot=1}
  var critW=Math.max(slot*(BW+GAP)-GAP,RW),altW=nA?nA*(BW+GAP)-GAP:0,contentW=Math.max(critW,altW);
  var offC=GUT+(contentW-(slot*(BW+GAP)-GAP))/2,AX=[];
  if(nA){if(altW>=critW){for(var i=0;i<nA;i++)AX.push(GUT+i*(BW+GAP)+BW/2)}else{var step=contentW/nA;for(var j=0;j<nA;j++)AX.push(GUT+step*(j+0.5))}}
  var AGAP=VGAP+24,yOf=function(d){return TOP+d*(H+VGAP)};
  var busY=yOf(maxD)+H+16,altY=yOf(maxD)+H+AGAP,altBusY=altY-16;
  var W=Math.ceil(GUT+contentW+RIGHT),Ht=Math.ceil((nA?altY+H:yOf(maxD)+H)+BOTTOM);
  var r=function(v){return Math.round(v)+0.5};
  var path='',boxes='',labels='';
  function box(cx,y,w,title,sub,thick,empty){
    var x=cx-w/2,ttl=dgFit(title||'이름 없음',w-PADX*2+4,TS,600);
    return '<g><title>'+esc(title||'이름 없음')+(sub?' · '+esc(sub):'')+'</title><rect x="'+r(x)+'" y="'+r(y)+'" width="'+Math.round(w)+'" height="'+H+'" fill="#fff" stroke="#111" stroke-width="'+(thick?2.4:1.1)+'"/>'+
      '<text x="'+cx.toFixed(1)+'" y="'+(hasSub&&sub?y+20:y+H/2+4.6).toFixed(1)+'" text-anchor="middle" font-size="'+TS+'" font-weight="600" fill="'+(empty?'#9a9a9a':'#111')+'">'+esc(ttl)+'</text>'+
      (sub?'<text x="'+cx.toFixed(1)+'" y="'+(y+36).toFixed(1)+'" text-anchor="middle" font-size="'+SS+'" fill="#6b6b6b">'+esc(dgFit(sub,w-PADX*2+4,SS,400))+'</text>':'')+'</g>';
  }
  (function walk(n,d){
    var cx=X[n.id]+offC,y=yOf(d),isRoot=d===0;
    boxes+=box(cx,y,isRoot?RW:BW,n.name,opt.sub?opt.sub(n):'',isRoot||(opt.emph&&opt.emph[n.id]),!n.name);
    if(n.children.length){
      var mid=y+H+VGAP/2,xs=n.children.map(function(c){return X[c.id]+offC});
      path+='M'+r(cx)+' '+(y+H)+'V'+r(mid);
      if(n.children.length>1)path+='M'+r(Math.min.apply(null,xs))+' '+r(mid)+'H'+r(Math.max.apply(null,xs));
      xs.forEach(function(x){path+='M'+r(x)+' '+r(mid)+'V'+(y+H+VGAP)});
      n.children.forEach(function(c){walk(c,d+1)});
    }else if(nA){path+='M'+r(cx)+' '+(y+H)+'V'+r(busY)}
  })(P.root,0);
  if(nA){
    /* 최하위 기준 → 위 가로선 → 가운데 줄기 → 아래 가로선 → 대안 (모든 최하위 기준에서 모든 대안을 비교한다는 뜻) */
    var leafX=[];(function lf(n){if(!n.children.length)leafX.push(X[n.id]+offC);else n.children.forEach(lf)})(P.root);
    var lmin=Math.min.apply(null,leafX),lmax=Math.max.apply(null,leafX),amin=Math.min.apply(null,AX),amax=Math.max.apply(null,AX);
    var trunk=(Math.max(lmin,amin)+Math.min(lmax,amax))/2,sl=leafX.slice().sort(function(a,b){return a-b}),near=function(arr,x,tol){return arr.some(function(v){return Math.abs(v-x)<tol})};
    if(sl.length>1&&near(sl,trunk,8)){var best=trunk,bd=1e9;for(var k=0;k<sl.length-1;k++){var m=(sl[k]+sl[k+1])/2,dd=Math.abs(m-trunk);if(dd<bd){bd=dd;best=m}}trunk=best}
    AX.forEach(function(ax){if(Math.abs(ax-trunk)>0.5&&Math.abs(ax-trunk)<12&&!near(sl,ax,8))trunk=ax});
    var t1=Math.min(lmin,trunk),t2=Math.max(lmax,trunk),b1=Math.min(amin,trunk),b2=Math.max(amax,trunk);
    if(t2>t1)path+='M'+r(t1)+' '+r(busY)+'H'+r(t2);
    path+='M'+r(trunk)+' '+r(busY)+'V'+r(altBusY);
    if(b2>b1)path+='M'+r(b1)+' '+r(altBusY)+'H'+r(b2);
    alts.forEach(function(a,i){path+='M'+r(AX[i])+' '+r(altBusY)+'V'+altY;boxes+=box(AX[i],altY,BW,a.name,opt.altSub?opt.altSub(a):'',opt.emph&&opt.emph[a.id],!a.name)});
  }
  for(var d=0;d<=maxD+(nA?1:0);d++){
    var cy=yOf(d)+H/2;
    labels+='<text x="'+LBLX+'" y="'+(cy-3).toFixed(1)+'" font-size="12" font-weight="600" fill="#111">계층 '+(d+1)+'</text><text x="'+LBLX+'" y="'+(cy+12).toFixed(1)+'" font-size="11" fill="#6b6b6b">'+(d>maxD?'대안':dgRole(d))+'</text>';
  }
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+Ht+'" viewBox="0 0 '+W+' '+Ht+'" font-family="'+DG_FONT.replace(/"/g,'')+'">'+
    '<rect width="100%" height="100%" fill="#fff"/><path d="'+path+'" fill="none" stroke="#2a2a2a" stroke-width="1" shape-rendering="crispEdges"/>'+labels+boxes+'</svg>';
  return {svg:svg,w:W,h:Ht};
}
function drawDiagram(id,P,opt){
  var el=document.getElementById(id);if(!el||!P||!P.root)return;
  var g=hierarchySvg(P,opt);
  el.innerHTML=g.svg;
  var s=el.querySelector('svg');if(s)s.style.minWidth=Math.round(Math.min(g.w,Math.max(460,g.w*0.62)))+'px';
}

ACT.dgPng=function(t){var s=document.querySelector('#'+t.dataset.target+' svg');if(!s)return;var c=s.cloneNode(true);c.removeAttribute('style');
  var w=+c.getAttribute('width'),h=+c.getAttribute('height'),scale=3,img=new Image();
  img.onload=function(){try{var cv=document.createElement('canvas');cv.width=w*scale;cv.height=h*scale;var g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(function(b){if(!b)return toast('PNG로 저장하지 못했습니다. SVG 저장을 이용하세요.',true);var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=dgFileBase()+'.png';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);toast('PNG로 저장했습니다.')},'image/png')}
    catch(e){toast('PNG로 저장하지 못했습니다. SVG 저장을 이용하세요.',true)}};
  img.onerror=function(){toast('PNG로 저장하지 못했습니다. SVG 저장을 이용하세요.',true)};

function treeHtml(n,d){
  var lab=d===0?'목표':d===1?'기준':'하위기준';
  var h='<div class="trow" style="--d:'+d+'"><span class="tl">'+lab+'</span><input type="text" data-in="nName" data-id="'+n.id+'" value="'+esc(n.name)+'" placeholder="'+(d===0?'목표 (예: 신사업 선정)':lab+' 이름')+'"><input type="text" class="tdesc" data-in="nDesc" data-id="'+n.id+'" value="'+esc(n.desc||'')+'" placeholder="설명 (선택)">'+
    '<div class="tbtns"><button class="btn sm" data-act="nAdd" data-id="'+n.id+'">+ '+(d===0?'기준':'하위')+'</button>'+(d>0?'<button class="btn sm ghost" data-act="nMove" data-dir="-1" data-id="'+n.id+'" title="위로">↑</button><button class="btn sm ghost" data-act="nMove" data-dir="1" data-id="'+n.id+'" title="아래로">↓</button><button class="btn sm ghost danger" data-act="nDel" data-id="'+n.id+'">삭제</button>':'')+'</div></div>';
  n.children.forEach(function(c){h+=treeHtml(c,d+1)});return h;
}
function altsHtml(){return AD.P.alts.map(function(a){return '<div class="arow"><input type="text" data-in="aName" data-id="'+a.id+'" value="'+esc(a.name)+'" placeholder="대안 이름"><input type="text" class="tdesc" data-in="aDesc" data-id="'+a.id+'" value="'+esc(a.desc||'')+'" placeholder="설명 (선택)"><div class="tbtns"><button class="btn sm ghost" data-act="aMove" data-dir="-1" data-id="'+a.id+'">↑</button><button class="btn sm ghost" data-act="aMove" data-dir="1" data-id="'+a.id+'">↓</button><button class="btn sm ghost danger" data-act="aDel" data-id="'+a.id+'">삭제</button></div></div>'}).join('')}
function problems(P){
  var out=[],M=matricesOf(P);
  (function w(n){if(!n.name.trim())out.push('이름이 빈 항목이 있습니다.');n.children.forEach(w)})(P.root);
  if(P.alts.some(function(a){return !a.name.trim()}))out.push('이름이 빈 대안이 있습니다.');
  if(P.alts.length===1)out.push('대안은 2개 이상이어야 합니다 (없어도 됩니다).');
  if(P.root.children.length<2&&P.alts.length<2)out.push('기준을 2개 이상 넣으세요.');
  (function w(n){if(n.children.length===1)out.push('‘'+(n.name||'이름 없음')+'’ 아래 항목이 1개뿐이라 비교가 없습니다.');if(n.children.length>9)out.push('‘'+n.name+'’ 아래 항목이 '+n.children.length+'개입니다. 7개 이하를 권장합니다.');n.children.forEach(w)})(P.root);
  if(!M.length)out.push('비교할 묶음이 없습니다.');
  return out.filter(function(v,i,a){return a.indexOf(v)===i});
}

function renderAside(){
  var P=AD.P,M=matricesOf(P),n=totalPairs(M),pr=problems(P);
  var h='<div class="card"><h3>요약</h3><div class="facts" style="margin-top:0"><div><b>'+M.length+'</b><span>비교 묶음</span></div><div><b>'+n+'</b><span>쌍대비교</span></div><div><b>'+Math.max(1,Math.round(n*12/60))+'분</b><span>1인 예상</span></div></div>'+
    (pr.length?'<div class="note warn">'+pr.map(esc).join('<br>')+'</div>':'<div class="note ok">모델 구성에 문제가 없습니다.</div>');
  if(P.id){
    if(!AD.justCreated)h+='<div style="margin-top:14px">'+linkBoxes(P,false)+'</div>';
    if((P.roster||[]).length)h+='<label class="lbl">사람별 링크</label><div class="tbl-wrap" style="max-height:220px;overflow:auto"><table class="tbl">'+P.roster.map(function(e){return '<tr><td>'+esc(e)+'</td><td style="text-align:right"><button class="btn sm ghost" data-act="copy" data-text="'+esc(linkOf(P,e))+'">복사</button></td></tr>'}).join('')+'</table></div>'+
      '<button class="btn sm" style="margin-top:8px" data-act="copy" data-text="'+esc(P.roster.map(function(e){return e+'\t'+linkOf(P,e)}).join('\n'))+'">명단+링크 전체 복사 (엑셀용)</button>';
  }else{
    if(!AD.owner&&AD.site&&AD.site.createMode==='code')h+='<label class="lbl" for="ccode">만들기 코드</label><input type="text" id="ccode" data-in="createCode" value="'+esc(AD.createCode)+'" placeholder="운영자에게 받은 코드">';
    h+='<p class="small muted" style="margin-top:12px">‘설문 만들기’를 누르면 응답자에게 보낼 링크와 나만 쓰는 관리 링크가 만들어집니다.</p>';
  }
  h+='<div class="toolbar" style="margin:16px 0 0"><button class="btn sm" data-act="exportJson">JSON 내보내기</button>'+(P.id?'<button class="btn sm danger" data-act="adDelProj">설문 삭제</button>':'')+'</div></div>';
  document.getElementById('aside').innerHTML=h;
  drawDiagram('dgModel',AD.P);
}
IN.pName=function(t){AD.P.name=t.value};IN.pDesc=function(t){AD.P.desc=t.value};
IN.createCode=function(t){AD.createCode=t.value.trim()};
IN.nName=function(t){findNode(AD.P.root,t.dataset.id).node.name=t.value;renderAsideKeep()};
IN.nDesc=function(t){findNode(AD.P.root,t.dataset.id).node.desc=t.value};
IN.aName=function(t){altById(t.dataset.id).name=t.value;renderAsideKeep()};
IN.aDesc=function(t){altById(t.dataset.id).desc=t.value};
IN.roster=function(t){var seen={};AD.P.roster=t.value.split(/\n/).map(function(s){return s.trim()}).filter(function(s){if(!s||seen[s])return false;seen[s]=1;return true});if(AD.P.id)renderAsideKeep()};
function renderAsideKeep(){var a=document.activeElement,cc=a&&a.id==='ccode';renderAside();if(cc){var c=document.getElementById('ccode');if(c){c.focus();c.setSelectionRange(c.value.length,c.value.length)}}}
CH.allowOpen=function(t){AD.P.allowOpen=t.checked};
ACT.pStatus=function(t){AD.P.status=t.dataset.v;t.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b===t)})};
function altById(id){return AD.P.alts.filter(function(a){return a.id===id})[0]}
function reTree(focusId){document.getElementById('tree').innerHTML=treeHtml(AD.P.root,0);document.getElementById('alts').innerHTML=altsHtml();renderAside();if(focusId){var el=document.querySelector('[data-id="'+focusId+'"][data-in]');if(el)el.focus()}}
ACT.nAdd=function(t){var n=findNode(AD.P.root,t.dataset.id).node,c=node('');n.children.push(c);reTree(c.id)};
ACT.nDel=function(t){if(!armed(t))return;var f=findNode(AD.P.root,t.dataset.id);f.parent.children.splice(f.parent.children.indexOf(f.node),1);reTree()};

/* ================= 파일 방식 공통: 모델 지문 · 응답 코드 ================= */
function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h>>>0}
function structOf(P){return matricesOf(P).map(function(m){return [m.key,m.items.map(function(i){return i.id})]})}
function hashStruct(st){return fnv(JSON.stringify(st)).toString(36)}
function modelHash(P){return hashStruct(structOf(P))}
var LEVELS='abcdefghijklmnopq';
function b64uEnc(str){var bytes=new TextEncoder().encode(str),bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64uDec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8',{fatal:true}).decode(bytes)}
function checksum(body){return ('0000'+fnv(body).toString(36)).slice(-4)}
/* 응답 코드: AHP1.모델지문.저장시각.이름.판단값(쌍마다 1글자).검사값 */
function encodeResponse(P,name,J,time){
  var st=structOf(P),chars='';
  st.forEach(function(s){var jm=J[s[0]],ids=s[1];for(var i=0;i<ids.length;i++)for(var j=i+1;j<ids.length;j++){var v=getJ(jm,ids[i],ids[j]);chars+=v==null?'-':LEVELS.charAt(SAATY.indexOf(nearestSaaty(v)))}});
  var body='AHP1.'+hashStruct(st)+'.'+Math.floor((time||Date.now())/60000).toString(36)+'.'+b64uEnc(name)+'.'+chars;
  return body+'.'+checksum(body);
}
var CODE_RE=/AHP1\.([0-9a-z]+)\.([0-9a-z]+)\.([A-Za-z0-9_-]+)\.([a-q-]+)\.([0-9a-z]{4})/g;
function decodeCodes(text,versions){
  var src=String(text||'').replace(/[\s​-‍﻿]+/g,''),out=[],m;
  CODE_RE.lastIndex=0;
  while((m=CODE_RE.exec(src))){
    var body=m[0].slice(0,m[0].length-5),short=m[0].slice(0,18)+'…';
    if(checksum(body)!==m[5]){out.push({error:'응답 내용 일부가 손상되었거나 바뀌었습니다',raw:short});continue}
    var st=versions[m[1]];
    if(!st){out.push({error:'이 설문의 응답이 아닙니다 (다른 설문의 파일)',raw:short});continue}
    var name;try{name=b64uDec(m[3])}catch(e){out.push({error:'이름을 읽을 수 없습니다',raw:short});continue}
    var need=sum(st.map(function(x){return x[1].length*(x[1].length-1)/2}));
    if(m[4].length!==need){out.push({error:'응답 내용이 설문 구조와 맞지 않습니다',raw:short});continue}
    var k=0,J={};
    st.forEach(function(s){var jm={},ids=s[1];for(var i=0;i<ids.length;i++)for(var j=i+1;j<ids.length;j++){var c=m[4].charAt(k++);if(c!=='-')jm[ids[i]+'|'+ids[j]]=SAATY[LEVELS.indexOf(c)]}J[s[0]]=jm});
    out.push({evaluator:name,judgments:J,updated:new Date(parseInt(m[2],36)*60000).toISOString(),hash:m[1]});
  }
  return out;
}

-head{align-items:flex-start}\n .card{padding:16px}.bars .row{grid-template-columns:minmax(80px,120px) 1fr 56px}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"top\">\u003cdiv class=\"brand\">AHP \u003cb>설문\u003c/b>\u003c/div>\u003cdiv class=\"top-right\" id=\"topRight\">\u003c/div>\u003c/header>\n\u003cdiv id=\"demoBar\">\u003c/div>\n\u003cmain id=\"view\">\u003cdiv class=\"center muted\">불러오는 중…\u003c/div>\u003c/main>\n\u003cdiv id=\"toast\">\u003c/div>\n\u003cscript>/*__AHPFILE__*/\u003c/script>\n\u003cscript>\n(function(){\n'use strict';\n/* ================= 기본 ================= */\nvar BOOT = window.BOOT || {};\nvar IS_GAS = !!(window.google && google.script && google.script.run);\nvar PARAMS = BOOT.params || (function(){var o={};new URLSearchParams(location.search).forEach(function(v,k){o[k]=v});return o})();\nvar BASE_URL = BOOT.url || location.href.split('#')[0].split('?')[0];\nvar HOOK = {};\nvar view = document.getElementById('view');\nvar topRight = document.getElementById('topRight');\n\nfunction esc(s){return String(s==null?'':s).replace(/[&\u003c>\"']/g,function(c){return {'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]})}\nfunction uid(){return Math.random().toString(36).slice(2,9)}\nfunction pct(x,d){return isFinite(x)?(x*100).toFixed(d==null?1:d)+'%':'–'}\nfunction sum(a){return a.reduce(function(s,v){return s+v},0)}\nfunction clone(o){return JSON.parse(JSON.stringify(o))}\nfunction fmtDate(iso){if(!iso)return '';var d=new Date(iso);return d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}\nvar toastT;\nfunction toast(msg,err){var t=document.getElementById('toast');t.textContent=msg;t.className='show'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(function(){t.className=''},err?4000:2200)}\nvar sstore={get:function(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del:function(k){try{sessionStorage.removeItem(k)}catch(e){}}};\nfunction loading(){view.innerHTML='\u003cdiv class=\"center muted\">불러오는 중…\u003c/div>'}\nfunction message(title,body){view.innerHTML='\u003cdiv class=\"narrow\">\u003cdiv class=\"card center\">\u003ch2>'+esc(title)+'\u003c/h2>\u003cp class=\"muted\">'+esc(body||'')+'\u003c/p>\u003c/div>\u003c/div>'}\n\n/* ================= 서버 연결 (구글 Apps Script 또는 데모) ================= */\nfunction api(action,payload){\n  if(IS_GAS){\n    return new Promise(function(res,rej){\n      google.script.run.withSuccessHandler(function(s){var r;try{r=JSON.parse(s)}catch(e){return rej(new Error('서버 응답 오류'))}r.ok?res(r.data):rej(new Error(r.error))})\n        .withFailureHandler(function(e){rej(new Error((e&&e.message)||'서버에 연결하지 못했습니다.'))}).api(action,JSON.stringify(payload||{}));\n    });\n  }\n  return new Promise(function(res,rej){setTimeout(function(){try{res(LocalAPI[action](payload||{}))}catch(e){rej(e)}},120)});\n}\nfunction publicProject(p){return {id:p.id,name:p.name,desc:p.desc,status:p.status,root:p.root,alts:p.alts,restricted:!p.allowOpen}}\nfunction checkEvaluator(p,ev){\n  if(!ev)throw new Error('이름(ID)을 입력하세요.');\n  if(!p.allowOpen&&(p.roster||[]).indexOf(ev)\u003c0)throw new Error('명단에 없는 평가자 ID입니다. 안내받은 ID를 확인하세요.');\n}\nvar LocalAPI=(function(){\n  var K='ahp_demo_db_v2',mem=null;\n  function load(){if(mem)return mem;try{mem=JSON.parse(localStorage.getItem(K))}catch(e){}if(!mem||!mem.projects)mem={projects:{},responses:{},settings:{createMode:'open',createCode:''}};return mem}\n  function save(){try{localStorage.setItem(K,JSON.stringify(mem))}catch(e){}}\n  function proj(id){var p=load().projects[id];if(!p)throw new Error('설문을 찾을 수 없습니다. 링크를 확인하세요.');return p}\n  function isOwner(k){return !!k&&k.indexOf('owner:')===0}\n  function auth(id,k){var p=proj(id);if(k&&(k===p.adminToken||isOwner(k)))return p;throw new Error('관리 권한이 없습니다. 관리 링크를 확인하세요.')}\n  function token(){return uid()+uid()+uid()}\n  return {\n    siteStatus:function(){return {hasOwner:true,createMode:load().settings.createMode}},\n    checkOwner:function(){return true},\n    getSettings:function(){return clone(load().settings)},\n    saveSettings:function(a){load().settings={createMode:a.createMode,createCode:a.createCode||''};save();return true},\n    createProject:function(a){var db=load(),st=db.settings;\n      if(!isOwner(a.key)){if(st.createMode==='closed')throw new Error('지금은 새 설문을 만들 수 없습니다.');if(st.createMode==='code'&&a.code!==st.createCode)throw new Error('만들기 코드가 맞지 않습니다.')}\n      var p=clone(a.project),now=new Date().toISOString();p.id=uid()+uid().slice(0,3);p.adminToken=token();p.created=now;p.updated=now;db.projects[p.id]=p;save();return {id:p.id,token:p.adminToken,updated:now}},\n    getProject:function(a){return clone(publicProject(proj(a.id)))},\n    getMyResponse:function(a){var p=proj(a.id);checkEvaluator(p,a.evaluator);var r=(load().responses[a.id]||{})[a.evaluator];return r?clone(r):null},\n    saveResponse:function(a){var p=proj(a.id);if(p.status==='closed')throw new Error('평가가 마감되었습니다.');checkEvaluator(p,a.evaluator);var db=load();db.responses[a.id]=db.responses[a.id]||{};var now=new Date().toISOString();db.responses[a.id][a.evaluator]={evaluator:a.evaluator,judgments:a.judgments,progress:a.progress,complete:a.complete,updated:now};save();return {updated:now}},\n    listProjects:function(){var db=load();return Object.keys(db.projects).map(function(id){var p=db.projects[id],rs=db.responses[id]||{},ks=Object.keys(rs);return {id:id,name:p.name,status:p.status,updated:p.updated,adminToken:p.adminToken,nResp:ks.length,nComplete:ks.filter(function(k){return rs[k].complete}).length}}).sort(function(a,b){return a.updated\u003cb.updated?1:-1})},\n    getProjectAdmin:function(a){return clone(auth(a.id,a.key))},\n    saveProject:function(a){var old=auth(a.project.id,a.key),db=load(),p=clone(a.project),now=new Date().toISOString();p.adminToken=old.adminToken;p.created=old.created;p.updated=now;db.projects[p.id]=p;save();return {id:p.id,updated:now}},\n    deleteProject:function(a){auth(a.id,a.key);var db=load();delete db.projects[a.id];delete db.responses[a.id];save();return true},\n    getResponses:function(a){auth(a.id,a.key);var rs=load().responses[a.id]||{};return Object.keys(rs).map(function(k){return clone(rs[k])})},\n    deleteResponse:function(a){auth(a.id,a.key);var db=load();if(db.responses[a.id])delete db.responses[a.id][a.evaluator];save();return true},\n    writeSheet:function(){throw new Error('데모 모드에서는 구글 시트 기록을 쓸 수 없습니다. CSV 내려받기를 이용하세요.')}\n  };\n})();\n\n/* ================= AHP 계산 ================= */\nvar RI=[0,0,0,0.58,0.90,1.12,1.24,1.32,1.41,1.45,1.49,1.51,1.48,1.56,1.57,1.59];\nfunction ri(n){return n\u003cRI.length?RI[n]:1.59}\nfunction findNode(root,id){var hit=null;(function w(n,p){if(hit)return;if(n.id===id){hit={node:n,parent:p};return}n.children.forEach(function(c){w(c,n)})})(root,null);return hit}\nfunction pathOf(root,id){var path=[];(function w(n,acc){if(n.id===id){path=acc.concat(n);return true}return n.children.some(function(c){return w(c,acc.concat(n))})})(root,[]);return path}\n/* 비교 묶음: 기준 묶음(위→아래) 먼저, 그다음 최하위 기준마다 대안 묶음(계층에 보이는 순서대로) */\nfunction matricesOf(P){\n  var crit=[],alt=[],q=[P.root];\n  while(q.length){var n=q.shift();\n    if(n.children.length>=2)crit.push({key:n.id,type:'crit',node:n,items:n.children});\n    q.push.apply(q,n.children);}\n  if(P.alts.length>=2)(function leaf(n){if(!n.children.length)alt.push({key:'A:'+n.id,type:'alt',node:n,items:P.alts});else n.children.forEach(leaf)})(P.root);\n  return crit.concat(alt);\n}\nfunction pairsOf(m){var r=[];for(var i=0;i\u003cm.items.length;i++)for(var j=i+1;j\u003cm.items.length;j++)r.push([m.items[i],m.items[j]]);return r}\nfunction pairsN(m){var n=m.items.length;return n*(n-1)/2}\nfunction totalPairs(M){return sum(M.map(pairsN))}\nfunction getJ(jm,a,b){if(!jm)return null;var v=jm[a+'|'+b];if(v!=null)return v;v=jm[b+'|'+a];return v!=null?1/v:null}\nfunction setJ(jm,a,b,v){delete jm[b+'|'+a];if(v==null)delete jm[a+'|'+b];else jm[a+'|'+b]=v}\nfunction answeredCount(m,jm){return pairsOf(m).filter(function(p){return getJ(jm,p[0].id,p[1].id)!=null}).length}\nfunction eig(ids,A){\n  var n=ids.length,w=A.map(function(r){return Math.pow(r.reduce(function(p,v){return p*v},1),1/n)}),s=sum(w);w=w.map(function(x){return x/s});\n  for(var it=0;it\u003c1000;it++){var nw=A.map(function(r){return r.reduce(function(t,v,j){return t+v*w[j]},0)});s=sum(nw);nw=nw.map(function(x){return x/s});\n    var d=Math.max.apply(null,nw.map(function(x,i){return Math.abs(x-w[i])}));w=nw;if(d\u003c1e-13)break;}\n  var Aw=A.map(function(r){return r.reduce(function(t,v,j){return t+v*w[j]},0)});\n  var lambda=sum(Aw.map(function(x,i){return x/w[i]}))/n;\n  var ci=n>2?(lambda-n)/(n-1):0,cr=n>2?Math.max(0,ci/ri(n)):0;\n  var o={};ids.forEach(function(id,i){o[id]=w[i]});\n  return {w:o,arr:w,lambda:lambda,ci:ci,cr:cr,A:A,ids:ids};\n}\nfunction priority(m,jm){\n  var ids=m.items.map(function(x){return x.id});\n  var A=ids.map(function(a,i){return ids.map(function(b,j){return i===j?1:getJ(jm,a,b)})});\n  if(A.some(function(r){return r.some(function(v){return v==null})}))return null;\n  return eig(ids,A);\n}\nvar SAATY=[9,8,7,6,5,4,3,2,1,1/2,1/3,1/4,1/5,1/6,1/7,1/8,1/9];\nfunction nearestSaaty(r){var best=1,bd=1e9;SAATY.forEach(function(o){var d=Math.abs(Math.log(o)-Math.log(r));if(d\u003cbd){bd=d;best=o}});return best}\nfunction ratioText(v){if(v==null)return '–';if(Math.abs(v-Math.round(v))\u003c1e-9)return String(Math.round(v));var inv=1/v;if(Math.abs(inv-Math.round(inv))\u003c1e-9)return '1/'+Math.round(inv);return v.toFixed(2)}\n/* 판단이 가장 어긋난 쌍 */\nfunction inconsistentPairs(res){\n  var out=[],ids=res.ids;\n  for(var i=0;i\u003cids.length;i++)for(var j=i+1;j\u003cids.length;j++){var imp=res.arr[i]/res.arr[j];out.push({a:ids[i],b:ids[j],cur:res.A[i][j],imp:imp,dev:Math.abs(Math.log(res.A[i][j])-Math.log(imp)),sug:nearestSaaty(imp)})}\n  return out.sort(function(x,y){return y.dev-x.dev});\n}\n/* 여러 평가자 판단의 가중 기하평균 (AIJ) */\nfunction aggregate(P,M,resps){\n  var agg={},missing={};\n  M.forEach(function(m){var jm={};pairsOf(m).forEach(function(p){var sl=0,sw=0;\n    resps.forEach(function(r){var v=getJ((r.judgments||{})[m.key],p[0].id,p[1].id);if(v!=null&&r.weight>0){sl+=r.weight*Math.log(v);sw+=r.weight}});\n    if(sw>0)jm[p[0].id+'|'+p[1].id]=Math.exp(sl/sw);else{jm[p[0].id+'|'+p[1].id]=1;missing[m.key]=true}});\n    agg[m.key]=jm;});\n  return {agg:agg,missing:missing};\n}\nfunction localWeights(M,jbm){var local={},res={};M.forEach(function(m){var r=priority(m,jbm[m.key]);if(r){local[m.key]=r.w;res[m.key]=r}});return {local:local,res:res}}\nfunction combine(P,local){\n  var g={},leaves=[],complete=true;\n  (function walk(n,gw){g[n.id]=gw;if(!n.children.length){leaves.push(n);return}\n    if(n.children.length===1){walk(n.children[0],gw);return}\n    var lw=local[n.id];if(!lw){complete=false;n.children.forEach(function(c){walk(c,NaN)});return}\n    n.children.forEach(function(c){walk(c,gw*lw[c.id])});})(P.root,1);\n  var alts=null;\n  if(P.alts.length>=2){var dist={},ideal={};P.alts.forEach(function(a){dist[a.id]=0;ideal[a.id]=0});\n    leaves.forEach(function(l){var lw=local['A:'+l.id];if(!lw){complete=false;return}\n      var mx=Math.max.apply(null,P.alts.map(function(a){return lw[a.id]}));\n      P.alts.forEach(function(a){dist[a.id]+=g[l.id]*lw[a.id];ideal[a.id]+=g[l.id]*lw[a.id]/mx})});\n    var si=sum(P.alts.map(function(a){return ideal[a.id]}))||1;P.alts.forEach(function(a){ideal[a.id]/=si});\n    alts={distributive:dist,ideal:ideal};}\n  return {global:g,leaves:leaves,alts:alts,complete:complete};\n}\nfunction sensAt(P,local,nodeId,t){\n  var f=findNode(P.root,nodeId),par=f.parent,base=local[par.id],o=base[nodeId],k=par.children.length,nw={};\n  par.children.forEach(function(c){nw[c.id]=c.id===nodeId?t:(o\u003c1-1e-9?base[c.id]*(1-t)/(1-o):(1-t)/(k-1))});\n  var L={};for(var key in local)L[key]=local[key];L[par.id]=nw;return combine(P,L);\n}\nfunction nodeLabel(P,m){if(m.type==='alt')return m.node.name+' · 대안';return m.node===P.root?'기준 비교':m.node.name+' · 하위'}\n\n/* ================= 이벤트 연결 ================= */\nvar ACT={},IN={},CH={};\ndocument.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t||t.disabled)return;var f=ACT[t.dataset.act];if(f){e.preventDefault();f(t,e)}});\ndocument.addEventListener('input',function(e){var t=e.target.closest('[data-in]');if(t&&IN[t.dataset.in])IN[t.dataset.in](t,e)});\ndocument.addEventListener('change',function(e){var t=e.target.closest('[data-ch]');if(t&&CH[t.dataset.ch])CH[t.dataset.ch](t,e)});\nfunction armed(t){if(t.classList.contains('armed'))return true;var old=t.textContent;t.classList.add('armed');t.textContent='한 번 더 누르면 삭제';setTimeout(function(){if(t.isConnected){t.classList.remove('armed');t.textContent=old}},3000);return false}\nfunction barsHtml(rows,sorted){\n  var list=rows.slice();if(sorted)list.sort(function(a,b){return b.v-a.v});\n  var mx=Math.max.apply(null,list.map(function(r){return r.v}).concat([1e-9]));\n  return '\u003cdiv class=\"bars\">'+list.map(function(r,i){return '\u003cdiv class=\"row'+(sorted&&i===0?' top':'')+'\">\u003cdiv class=\"nm\" title=\"'+esc(r.name)+'\">'+(sorted?'\u003cspan class=\"rank\">'+(i+1)+'\u003c/span>':'')+esc(r.name)+'\u003c/div>\u003cdiv class=\"bar\">\u003ci style=\"width:'+(isFinite(r.v)?r.v/mx*100:0)+'%\">\u003c/i>\u003c/div>\u003cdiv class=\"v\">'+pct(r.v)+'\u003c/div>\u003c/div>'}).join('')+'\u003c/div>';\n}\nfunction crTag(m,r){if(!r)return '\u003cspan class=\"tag\">미완료\u003c/span>';if(m.items.length\u003c=2)return '\u003cspan class=\"tag ok\">항상 일관\u003c/span>';return '\u003cspan class=\"tag '+(r.cr\u003c=CRL()?'ok':'bad')+'\">CR '+r.cr.toFixed(3)+'\u003c/span>'}\n\n/* ================= 평가자 화면 ================= */\nvar EV={P:null,M:[],who:'',J:{},idx:0,timer:null,saving:false,pending:false,summary:false,state:''};\nvar SCALE=[9,7,5,3,1,3,5,7,9];\nvar DEG={1:'같음',3:'약간',5:'강하게',7:'매우',9:'극히'};\nfunction jo(w,k){var p={'을':['을','를'],'이':['이','가'],'은':['은','는']}[k],c=w.charCodeAt(w.length-1);\n  if(c\u003c0xAC00||c>0xD7A3)return w+p[0]+'('+p[1]+')';return w+((c-0xAC00)%28?p[0]:p[1])}\nfunction CRL(){var v=EV.P?+EV.P.crLimit:0;return v>0&&v\u003c=1?v:0.1}\nfunction showRes(){return !!(EV.P&&EV.P.showResults)}\nfunction odd(x){return Math.min(9,Math.max(1,2*Math.round((x-1)/2)+1))}\n/* 선택한 값의 뜻을 주제에 맞는 문장으로 보여 줍니다. 항목의 w(챙기고 싶은 것), l(포기하는 것), s(대안 비교 장면)를 씁니다. */\nfunction meaningOf(m,a,b,v){\n  if(v==null)return '';\n  var k=odd(v>=1?v:1/v),H=v>=1?a:b,O=v>=1?b:a,alt=m.type==='alt',txt;\n  if(alt){\n    var s=m.node.s||(m.node.name+' 면에서');\n    txt={1:s+' 두 방식이 똑같이 도움이 됩니다.',\n         3:s+' 둘 다 쓸 만하지만 '+jo(H.name,'이')+' 조금 더 낫습니다.',\n         5:s+' 하나만 쓸 수 있다면 '+jo(H.name,'을')+' 쓰겠습니다.',\n         7:s+' '+jo(H.name,'이')+' 훨씬 낫고, '+jo(O.name,'은')+' 별로 도움이 안 됩니다.',\n         9:s+' '+jo(O.name,'은')+' 거의 쓰지 않을 만큼 '+jo(H.name,'이')+' 낫습니다.'}[k];\n  }else{\n    var hw=H.w||H.name,ow=O.w||O.name,ol=O.l||(O.name+'이 부족한 것');\n    txt={1:'둘 다 똑같이 중요하게 봅니다.',\n         3:'둘 다 보지만, '+hw+' 쪽에 조금 더 마음이 갑니다.',\n         5:'둘 중 하나만 챙길 수 있다면 '+hw+' 쪽을 택합니다.',\n         7:jo(hw,'이')+' 보장된다면 '+ol+'도 감수합니다.',\n         9:jo(hw,'이')+' 없다면, '+jo(ow,'이')+' 아무리 좋아도 그 방식은 쓰지 않습니다.'}[k];\n  }\n  var head=k===1?'같음(1)':esc(H.name)+' 쪽 '+DEG[k]+'('+k+')';\n  return '\u003cdiv class=\"meaning'+(k===1?'':v>1?' l':' r')+'\">선택: \u003cb>'+head+'\u003c/b> · '+esc(txt)+'\u003c/div>';\n}\n\n\nfunction evStart(pid,pref){\n  loading();\n  api('getProject',{id:pid}).then(function(P){\n    EV.P=P;EV.M=matricesOf(P);document.title=P.name+' · AHP 평가';\n    if(P.status==='closed')return message('평가가 마감되었습니다','궁금한 점은 관리자에게 문의해 주세요.');\n    if(!EV.M.length)return message('아직 평가할 항목이 없습니다','관리자가 모델을 준비하고 있습니다.');\n    evLogin(pref);\n  }).catch(function(err){message('프로젝트를 열 수 없습니다',err.message)});\n}\nfunction evLogin(pref){\n  var n=totalPairs(EV.M),P=EV.P;\n  view.innerHTM   items.forEach(function(it){if(it.error){errs.push(it);return}

function importFiles(list){
  var files=[].slice.call(list||[]);if(!files.length)return;
  Promise.all(files.map(function(f){return f.text().then(function(s){return {f:f,s:s}})})).then(function(rs){
    var items=[],notes=[];
    rs.forEach(function(r){var nm=r.f.name;
      if(/\.html?$/i.test(nm)){notes.push(nm+': 평가자용 설문 파일입니다. 평가자가 회신한 응답 파일(.json)을 넣어 주세요.');return}
      var o=null;try{o=JSON.parse(r.s)}catch(e){}
      if(o&&o.format==='AHP-admin-project'){notes.push(nm+': 관리 파일입니다. 위쪽 ‘관리 파일 열기’로 여세요.');return}
      var text=o&&o.format==='AHP-response'?o.code:r.s;
      var got=decodeCodes(text,knownVersions());
      if(!got.length){notes.push(nm+(o&&o.format==='AHP-response'?': 응답 파일 내용이 손상되었습니다. 평가자에게 다시 보내 달라고 해 주세요.':': AHP 응답 파일이 아닙니다.'));return}

function parsePeople(text){
  var out=[],bad=[];
  String(text||'').split(/\r?\n/).forEach(function(line,i){var s=line.trim();if(!s)return;
    var parts=s.split(/[,\t;]+/).map(function(x){return x.trim()}).filter(Boolean),email='',code='';
    parts.forEach(function(p){if(/@/.test(p))email=p;else code=p.toUpperCase()});
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))bad.push((i+1)+'번째 줄: 이메일이 없습니다');
    else out.push({code:code,email:email});
  });
  return {list:out,bad:bad};
}

function simState(){var P=AD.P;P.sim=P.sim||{};if(!Array.isArray(P.sim.personas)||!P.sim.personas.length)P.sim.personas=simDefaults();if(!P.sim.seed)P.sim.seed=31;return P.sim}
function simRand(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function simOdd(r){var x=Math.abs(Math.log(r)),best=1;[1,3,5,7,9].forEach(function(k){if(Math.abs(Math.log(k)-x)<Math.abs(Math.log(best)-x))best=k});return r>=1?best:1/best}
function simGenerate(){
  var P=AD.P,S=simState(),M=matricesOf(P),rnd=simRand(S.seed),crits=P.root.children,leaves=[];
  (function lf(n){if(!n.children.length)leaves.push(n);else n.children.forEach(lf)})(P.root);
  var normal=function(){var u=1-rnd(),v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  SIM.resp=S.personas.map(function(p){
    var J={},ageAI=p.age===0?1.1:p.age===3?0.85:1,ageOff=p.age===3?1.15:1;
    var weightOf=function(m,it){
      if(m.type==='alt'){var li=leaves.indexOf(m.node),ai=P.alts.indexOf(it),b=(SIM_BASE[li]||[1,1,1])[ai];if(b==null)b=1;
        var mult=[(p.mult[0]||1)*ageAI,p.mult[1]||1,(p.mult[2]||1)*ageOff][ai];return b*(mult==null?1:mult)}
      if(m.node===P.root){var ci=crits.indexOf(it);return Math.max(0.01,+p.w[ci]||0.25)}
      var ci2=crits.indexOf(m.node),sh=+p.share[ci2];if(!(sh>0&&sh<1))sh=0.5;return m.node.children.indexOf(it)===0?sh:(1-sh)/Math.max(1,m.node.children.length-1)};
    var lim=+P.crLimit>0?+P.crLimit:0.1,sig=+p.noise||0.4,fix=Math.max(0.3,1-sig*0.7);
    var draw=function(m,sd){var jm={};pairsOf(m).forEach(function(pr){var r=weightOf(m,pr[0])/weightOf(m,pr[1])*Math.exp(sd*normal());jm[pr[0].id+'|'+pr[1].id]=simOdd(r)});return jm};
    M.forEach(function(m){var jm=draw(m,sig),k=0;
      // 설문의 '다시 확인' 단계: 일관성이 낮으면 일부 응답자는 판단을 다시 고친다 (흔들림이 클수록 덜 고침)
      while(m.items.length>2&&k<3){var pr=priority(m,jm);if(!pr||pr.cr<=lim||rnd()>fix)break;k++;jm=draw(m,sig*Math.pow(0.5,k))}
      J[m.key]=jm});
    return {evaluator:p.code,judgments:J,updated:new Date().toISOString(),sim:true};
  });

}

      '<button class="btn sm" id="simApply" data-act="simRun">고친 내용으로 다시 계산</button><button class="btn sm" data-act="simSeed" title="같은 페르소나로 판단의 흔들림만 새로 뽑습니다">흔들림 새로 뽑기</button><button class="btn sm" data-act="simAdd">페르소나 추가</button><button class="btn sm" data-act="simCsv">CSV</button><button class="btn sm ghost danger" data-act="simReset">기본 20명으로 되돌리기</button></div>'+
      '<p class="small muted" style="margin:0 0 8px">연령 '+SIM_AGES.map(function(a,i){return a+' '+(ac[i]||0)+'명'}).join(' · ')+' / AI 자주 씀 '+hi+'명 · 드물게 씀 '+(S.personas.length-hi)+'명 · 흔들림 시드 '+S.seed+'</p>'+
      '<div class="sim-wrap"><table class="tbl sim-tbl"><tr><th>코드</th><th>페르소나</th><th>연령</th><th>성별</th><th>촬영 경력</th><th>AI 이용 빈도</th>'+cn.map(function(n){return '<th>'+esc(n)+'</th>'}).join('')+an.map(function(n){return '<th>'+esc(n)+' 선호</th>'}).join('')+'<th>흔들림</th><th>최대 CR</th><th></th></tr>'+rows+'</table></div>'+
      '<p class="small muted" style="margin:8px 0 0">기준 칸은 그 사람이 기준을 얼마나 중시하는지(합이 1이 아니어도 비율로 계산), 선호 칸은 세 방식에 대한 인식 배율(1 = 보통)입니다. 흔들림이 클수록 판단이 들쭉날쭉해져 CR이 높아지고, 설문의 ‘다시 확인’ 단계에서 고치는 비율도 낮아집니다. 하위기준과 대안의 기본 인식은 연구 가설 수준의 값으로 고정되어 있습니다.</p></div>'+
    '<div class="card"><h3>집단별 보기</h3><div class="toolbar" style="margin:0">'+simGroupDefs().map(function(d){return '<button class="btn sm'+(SIM.group===d[0]?' primary':'')+'" data-act="simGroup" data-g="'+d[0]+'">'+esc(d[1])+'</button>'}).join('')+'</div></div>'+
    '<p class="muted" style="margin:0 0 12px">가상 응답 '+AD.resp.length+'명 · 통합에 포함 '+C.inc.length+'명</p>';
}
(function(){
  var _head=HOOK.resultsHead;
  HOOK.resultsHead=function(P,C){return FA.tab==='sim'?simHead(P,C):_head(P,C)};
  var _faRender=faRender;
  faRender=function(){if(FA.tab==='sim'){adTop();if(!SIM.ready)simGenerate();showResults(AD.P,SIM.resp.slice());faSaveSoon();return}_faRender()};
  var _del=ACT.respDel;
  ACT.respDel=function(t){if(FA.tab!=='sim')return _del(t);simSel(t.dataset.e,false);rerenderKeep()};
})();
ACT.demoFill=function(){
  var P=AD.P,M=matricesOf(P);if(blocking(P).length)return toast('먼저 1단계에서 모델을 완성하세요.',true);
  var names=(P.roster&&P.roster.length?P.roster.slice(0,4):['연습1','연습2','연습3','연습4']),text='';
  names.forEach(function(nm,k){var J={};
    M.forEach(function(m){var tw=m.items.map(function(){return Math.pow(Math.random(),1.5)+0.15}),jm={};
      pairsOf(m).forEach(function(p){var i=m.items.indexOf(p[0]),j=m.items.indexOf(p[1]);jm[p[0].id+'|'+p[1].id]=nearestSaaty(tw[i]/tw[j]*Math.exp((Math.random()-.5)*(k===2?2.2:.6)))});J[m.key]=jm});
    if(k===3&&M.length>1)delete J[M[M.length-1].key];
    text+='연습 응답 '+nm+': '+encodeResponse(P,nm,J)+'\n';
  });
  mergeResponses(decodeCodes(text,knownVersions()));
};

ACT.faProjSave=function(){faSaveNow();download('AHP관리_'+safeName(AD.P.name||'설문')+'.json',JSON.stringify({format:'AHP-admin-project',version:1,savedAt:new Date().toISOString(),project:AD.P,responses:FA.resp},null,2),'application/json');toast('관리 파일을 저장했습니다. 다른 PC에서는 ‘관리 파일 열기’로 이어서 하세요.')};
CH.faProjOpen=function(t){var f=t.files[0];if(!f)return;f.text().then(function(s){var o=JSON.parse(s);
  if(!o||o.format!=='AHP-admin-project'||!o.project||!o.project.root)throw new Error('AHP 관리 파일이 아닙니다.');
  FA.P=o.project;FA.P.versions=FA.P.versions||{};FA.P.roster=FA.P.roster||[];FA.resp=o.responses||[];AD.P=FA.P;AD.sel={};FA.report=null;FA.undo=null;FA.tab=FA.resp.length?'collect':'model';faSaveNow();faRender();toast('관리 파일을 열었습니다.')}).catch(function(e){toast(e.message||'파일을 읽지 못했습니다.',true)});t.value=''};
ACT.faNew=function(t){if(!armed(t))return;FA.undo=null;FA.P=faBlank();FA.resp=[];AD.P=FA.P;AD.sel={};FA.report=null;FA.tab='model';faSaveNow();faRender();toast('새 설문을 시작합니다. 이전 설문이 필요하면 먼저 관리 파일로 저장해 두세요.')};

document.title='AHP 관리자 · 카메라 구매 설문';
